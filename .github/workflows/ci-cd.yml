name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run pointless. The Pages
# deploy has its own group further down, because cancelling mid-deploy is not safe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PLAYWRIGHT_VERSION: '1.62.1'

  # Firebase Hosting. Authentication is keyless: the provider below is locked to
  # this repository by an attribute condition, so no other repo can mint a token
  # for this service account, and there is no JSON key anywhere to leak or rotate.
  FIREBASE_TOOLS_VERSION: '15.25.1'
  GCP_PROJECT: merchant-agent-console
  GCP_WIF_PROVIDER: projects/146537768310/locations/global/workloadIdentityPools/github/providers/merchant-agent
  GCP_SERVICE_ACCOUNT: github-actions-deploy@merchant-agent-console.iam.gserviceaccount.com

jobs:
  static:
    name: HTML, links & size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No lockfile is committed, so `npm install` rather than `npm ci`. Both
      # devDependencies are pinned to exact versions in package.json, which gives
      # the same reproducibility without a lockfile nobody can regenerate locally
      # (this machine has no node installed).
      - run: npm install --no-audit --no-fund

      - name: Validate HTML
        run: npm run lint:html

      - name: Assemble the publishable site
        run: npm run build

      - name: Check size budget
        run: npm run budget

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            merchant-agent-platform-1.html
            PRESENTATION-SCRIPT.md
          fail: true
          # The console currently has no outbound links at all, so lychee finding
          # zero of them is the expected state, not a misconfiguration.
          failIfEmpty: false
          token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --no-audit --no-fund

      # ~130 MB download; keyed on the pinned Playwright version so it only
      # re-downloads when the dependency actually moves.
      - name: Restore browser cache
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Chromium
        run: |
          # The runner image ships third-party apt repos (packages.microsoft.com)
          # that intermittently return 403. `--with-deps` runs apt-get update, which
          # then fails as a whole even though nothing Chromium needs comes from them.
          sudo grep -rl 'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          npx playwright install --with-deps chromium

      # Both projects (desktop + Pixel 5) are Chromium, so one browser covers all.
      - name: Run tests
        run: npm test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # build.mjs is pure node stdlib, so no dependency install is needed here.
      - name: Assemble the publishable site
        run: npm run build

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: ./lighthouserc.json
          # Deliberately NOT uploading to temporary-public-storage: the reports
          # embed the page, and the page contains a real merchant's revenue.
          uploadArtifacts: false

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          # .lighthouseci is a dotfile directory, which upload-artifact skips by
          # default — without this the step "succeeds" while uploading nothing.
          include-hidden-files: true
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: [static, e2e, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    # Never cancel a deploy that is already writing to Pages.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/configure-pages@v6

      - name: Assemble the publishable site
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

  # Second live target, gated on exactly the same three checks as Pages. The two
  # deploys are independent: if Firebase is down or its credentials expire, the
  # Pages URL still ships, and vice versa.
  deploy-firebase:
    name: Deploy to Firebase Hosting
    needs: [static, e2e, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # the OIDC token exchanged for GCP credentials

    concurrency:
      group: firebase-live
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assemble the publishable site
        run: npm run build

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # firebase-tools picks up the credentials file that the auth step exports
      # via GOOGLE_APPLICATION_CREDENTIALS.
      - name: Deploy
        id: deploy
        run: |
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy \
            --only hosting \
            --project ${{ env.GCP_PROJECT }} \
            --non-interactive

      - name: Summarise
        run: echo "Live at https://${{ env.GCP_PROJECT }}.web.app" >> "$GITHUB_STEP_SUMMARY"

  # What Pages cannot do: a real, isolated URL per pull request. Channels expire on
  # their own, so review links do not accumulate forever.
  preview-firebase:
    name: PR preview on Firebase
    needs: [static, e2e, lighthouse]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write # to post the preview URL back onto the PR

    concurrency:
      group: firebase-preview-${{ github.event.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assemble the publishable site
        run: npm run build

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Deploy preview channel
        id: preview
        run: |
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} hosting:channel:deploy \
            "pr-${{ github.event.number }}" \
            --project ${{ env.GCP_PROJECT }} \
            --expires 7d \
            --non-interactive \
            --json > channel.json
          URL=$(node -e "
            const r = require('./channel.json').result;
            const site = Object.values(r)[0];
            console.log(site.url);
          ")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      # --edit-last keeps one comment per PR instead of a new one on every push.
      - name: Post the URL on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.number }}" \
            --body "Preview for \`${{ github.sha }}\`: ${{ steps.preview.outputs.url }} (expires in 7 days)" \
            --edit-last --create-if-none
