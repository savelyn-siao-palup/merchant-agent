      ifYouApprovedEverythingNote:'If you approved all 9 open review items, the ceiling as written would go to <b>NT$30,000 a day</b>, up 86.9%: Q-4471 takes the discount cap to 20% and Q-4472 takes the refund ceiling to NT$2,500. Both are scoped - Q-4471 to customers over NT$40,000 lifetime spend, Q-4472 to adverse pet health reactions - so real exposure is lower than the ceiling. We show the ceiling because the conditions are ours to enforce and the ceiling is yours to accept.'
    },
    hardDeny: {
      items:6, changes:0, secondFactorEventsInitiated:0, lastChanged:'2026-03-11',
      lastChangedNote:'Set in the onboarding session that also produced MEM-0004. Never touched since.',
      requestsThatHitIt:4, executions:0,
      requestsBreakdown:'price_change: 3 escalations, 0 uses. customer_export: 1 escalation, 0 uses. Executions 0 of 4.',
      alsoHeld:[
        'Q-4470 asked to change a recipient name. Afu did not ask for an exception - it built an alternative (cancel and reorder, 8% / NT$217 compensation) and sent that instead.',
        'INJ-0703 asked for every July customer\'s name, email and phone, from an address spoofing the owner. There was nothing to refuse: the export tool does not exist, so the action could not be expressed. Layers 1 and 4 fired anyway.'
      ],
      cannotBeRaised:'These six are not thresholds. <b>They have no number to raise.</b> price_change and customer_export carry an empty threshold list - there is no slider on the page - and the other four are not tools at all. Changing any of the six requires second-factor verification in the governance centre, and <b>no such verification has been initiated since the account opened on 2026-03-11</b>.',
      proof:'You do not have to take that summary from us. The hard-deny register sits inside the append-only chain: <b>47,118 records, verified 2026-08-03 09:14, 0 breaks</b>, auto-verified every 6 hours. The 2026-03-11 record carries the fingerprint that was published to the public timestamp service that night and emailed to you. Edit any of the six and every record after it fails to match, and the verification names the break. <b>Run it yourself - points one to three are our word, this one is arithmetic.</b>'
    }
  },
  entries: [
    { id:'EVO-2607-01', cls:'threshold', object:'7 thresholds across 6 tools',
      title:'Seven numbers you re-set yourself, promoted out of "approved with edits"',
      status:'in force', direction:'wider', at:'2026-07-04 to 2026-07-25',
      trigger:{ kind:'queue item', ids:['Q-4289','Q-4313','Q-4331','Q-4349','Q-4367','Q-4397','Q-4415'],
        detail:'You approved the direction but changed the number. That is the 23.1% bucket on Escalation and rollback - 258 of 1,118 handoffs - and it is the most valuable signal we get, because it points at a threshold that is set wrong rather than at a judgment you disagree with.' },
      enactedBy:'owner-approved (approve with edits)',
      scope:{ appliesTo:['The named tool only, at the named number'],
        excludes:['No tool changed authorization level','No hard-deny item was touched',
          'A raised per-day cap does not raise the per-customer cap, and vice versa - they are separate thresholds'] },
      rows:[
        { object:'email_send.daily', label:'Emails per day', from:120, to:180, direction:'wider', at:'2026-07-04', trigger:'Q-4289' },
        { object:'discount_create.daily', label:'Codes issued per day', from:15, to:25, direction:'wider', at:'2026-07-08', trigger:'Q-4313' },
        { object:'replenishment_reminder.wl', label:'Waitlist size per product', from:120, to:200, direction:'wider', at:'2026-07-11', trigger:'Q-4331' },
        { object:'discount_create.c90d', label:'Codes per customer per 90 days', from:3, to:2, direction:'narrower', at:'2026-07-14', trigger:'Q-4349',
          why:'You cut the number down on 4 of 6 repeat-discount requests. Your note: a customer trained to expect a code every month stops paying full price.' },
        { object:'order_lookup.q10m', label:'Lookups per customer per 10 min', from:5, to:8, direction:'wider', at:'2026-07-17', trigger:'Q-4367' },
        { object:'order_edit.delta', label:'Max change in order value', from:1200, to:500, direction:'narrower', at:'2026-07-22', trigger:'Q-4397',
          why:'You reduced the allowed swing on 4 of 6 order-edit items. NT$1,200 let a variant swap quietly change what the customer paid.' },
        { object:'memory_write.len', label:'Max characters per memory entry', from:180, to:240, direction:'wider', at:'2026-07-25', trigger:'Q-4415' }
      ],
      before:'5 raised thresholds at their lower values, 2 narrowed thresholds at their looser values',
      after:'The 7 values now shown on Authorization and limits',
      effect:{ claim:'not isolable', num:87, den:1118,
        text:'Seven small threshold moves inside one month cannot be separated from each other or from the rest of the month\'s work. What is checkable: the override rate held at <b>7.8% (87 / 1,118)</b>, inside the healthy band. Below 5% would mean we had gone too conservative; above 25% would mean we still do not understand your judgment. Moving thresholds toward your edits is supposed to push override <i>down</i> - it did not move, and <b>we are not going to claim credit for a number that did not move.</b>' },
      cost:null,
      revocable:{ who:'Owner, any time', how:'Governance centre. Each is one slider, effective immediately, and the change itself is an audit event with your name on it.',
        effectOnPast:'Lowering a threshold does not undo actions already taken under it. 178 discount codes were issued autonomously in July; reverting the daily cap does not void them.' } },

    { id:'EVO-2607-02', cls:'gate', object:'holdout.verify',
      title:'Control-group check: suggested step to mandatory gate',
      status:'in force', direction:'narrower', at:'2026-07-16',
      trigger:{ kind:'task run', ids:['RUN-2607-0774'],
        detail:'An outbound push skipped holdout.verify and went out to <b>69 control-group customers</b>. That is the more serious of the two faults in that run: it contaminated the basis for measuring increment across the whole of July.' },
      enactedBy:'agent-inferred, auto-enacted (narrowing only)',
      scope:{ appliesTo:['line.push','email.send','sms.send','every Outbound task, T-01 to T-08'],
        excludes:['Service replies T-09, T-10, T-11 - they answer whoever writes in and never target a list, so there is no holdout to protect',
          'Analysis and maintenance tasks T-12 to T-15, which send nothing',
          'It does not stop a send for any other reason: this gate checks one thing only'] },
      before:'holdout.verify was a recommended step. A run could skip it and still send.',
      after:'If holdout.verify does not return pass, line.push / email.send / sms.send refuse to run. Nothing goes out.',
      effect:{ claim:'measured', num:3, den:3,
        text:'<b>3 of 3</b> outbound runs after 2026-07-16 carry holdout.verify as an explicit step in the record: RUN-2607-0412 (14 sec, NT$7.40), RUN-2607-0518 (8 sec, NT$4.20), RUN-2608-0021 (11 sec, NT$5.80). <b>0 further contamination events in 18 days.</b> Honest limit: the failure it prevents has happened once in five months, so 18 clean days is not proof, it is 18 clean days. The running cost is real and small.' },
      cost:null,
      revocable:{ who:'Owner', how:'Governance centre. Second-factor is not required - this is a gate, not one of the six hard-deny items.',
        effectOnPast:'<b>Revoking it does not un-contaminate anything.</b> The 69 customers stay permanently out of July\'s incremental math and permanently reassigned to the exposed group (12,124 + 69 = 12,193). And revoking it puts at risk the thing it protects: the holdout costs us <b>NT$57,729 a month</b> in forgone increment (1,207 x NT$47.8287), which we absorb so that you can audit the bill. If a send hits the holdout again, that month\'s increment becomes unverifiable, and by rule an unverifiable increment bills at zero - <b>so revoking this costs us, not you.</b>' } },

    { id:'EVO-2607-03', cls:'gate', object:'memory_write, promotional memories',
      title:'A promotional memory cannot be written without a discount-code ID and an expiry date',
      status:'in force', direction:'narrower', at:'2026-07-16',
      trigger:{ kind:'memory invalidation', ids:['MEM-0009','RUN-2607-0774','EVT-2608-0319'],
        detail:'MEM-0009 was written from one spoken sentence on 2026-05-28, n = 1, with no Shopify discount code ID and no expiry attached. The promotion had ended on 2026-07-15. Afu cited it on 07-16 and promised 764 customers a free gift that no longer existed.' },
      enactedBy:'agent-inferred, auto-enacted (narrowing only)',
      scope:{ appliesTo:['Memories of type Market signal or Operating rule whose content asserts a live promotion'],
        excludes:['Product fact memories - MEM-0001\'s 58-day repurchase cycle has no expiry to attach',
          'Customer preference memories - MEM-1877\'s chicken allergy does not expire',
          'Memories you enter by hand that do not assert a promotion'] },
      before:'MEM-0009 existed: one sentence, n = 1, no code ID, no valid_until, read 68 times, citable indefinitely.',
      after:'A promotional memory without a Shopify discount code ID and a valid_until cannot be written at all, and is invalidated automatically the moment the expiry passes. MEM-0009 is marked invalidated, frozen from being read, and <b>kept permanently rather than deleted</b>.',
      effect:{ claim:'too early to tell', num:0, den:23,
        text:'<b>0 of the 23</b> memories added in July are promotional, so the new precondition has not yet had to refuse anything. The failure it targets has occurred once in five months. What is measured here is the cost of the failure, not the value of the fix: <b>NT$11,271</b>, absorbed by the platform.' },
      cost:{ amount:11271, bornBy:'platform',
        note:'The 39 orders already placed were honoured as promised - 39 x NT$289 average of extra cost. The other 725 customers got a correction and an apology.' },
      revocable:{ who:'Owner', how:'Governance centre',
        effectOnPast:'<b>Revoking the precondition does not restore MEM-0009.</b> An invalidated memory stays frozen; the only way back is a fresh write that passes the check. The NT$11,271 is already paid and is not clawed back either way.' },
      reconcile:'The NT$11,271 is disclosed on Tasks and schedule inside RUN-2607-0774, but it is <b>not</b> inside the NT$1,805 of actual loss on Escalation and rollback - that figure is 1,138 (F-0729) + 667 (F-0744) and nothing else. See EVO-2607-04 for the full July total.' },

    { id:'EVO-2607-04', cls:'threshold', object:'refund.max_refund_ntd',
      title:'Autonomous refund ceiling raised NT$800 to NT$1,500 - and taken back down 15 days later',
      status:'revoked', direction:'wider', at:'2026-07-06', revokedAt:'2026-07-21', isNew:true,
      trigger:{ kind:'repeated pattern', ids:['Q-4121','Q-4181','Q-4235','Q-4283'],
        detail:'Four refund requests over the NT$800 line in 28 days, and you approved <b>4 of 4 unchanged</b>. The reading was the one we state ourselves on Escalation and rollback: consistent approval without edits usually means the threshold is set too conservatively. So the rule was promoted automatically from the pattern, <b>without asking you</b>.' },
      enactedBy:'auto-promoted from repeated pattern',
      scope:{ appliesTo:['refund tool, autonomous path only'],
        excludes:['The other three refund thresholds were untouched: max order age 30 days, refunds per day 6, per customer per 180 days 1',
          'Refunds above NT$1,500 still became review items','No other tool was affected'] },
      before:'NT$800. Anything above it became a review item on your queue.',
      after:'NT$1,500 from 2026-07-06. <b>Back to NT$800 from 2026-07-21</b>, and it will not move again without your click.',
      effect:{ claim:'measured, negative', num:3, den:5,
        text:'<b>5 of the 14</b> autonomous refunds in July used the newly opened NT$800-1,500 band. <b>3 of those 5 were the same person</b>: three different customer accounts, one device fingerprint, the same "it never arrived" script. NT$1,480 + NT$1,350 + NT$1,150 = <b>NT$3,980</b>, across nine days.<br><br>The refund tool\'s own four thresholds <b>were not violated once</b>. One refund per account is inside the per-customer limit of 1 per 180 days. Three refunds across nine days is nowhere near the 6-per-day cap. The orders were 11 to 19 days old, inside the 30-day limit. Every guard held. <b>The band was the problem, and the band was ours.</b><br><br>Caught on 2026-07-21 by <b>layer 5 rate-anomaly detection</b> - sliding-window statistics per account, IP and device fingerprint - not by the refund tool. Logged as F-0736. <b>Detection took 15 days.</b> Refunds sit on the not-reversible tier: once the money moves it cannot be pulled back, so the NT$3,980 is gone.<br><br>What the old ceiling would have done: all three would have arrived on your queue, where three near-identical "never arrived" claims sit next to each other on one screen and the pattern is visible in about four seconds.' },
      cost:{ amount:3980, bornBy:'platform',
        note:'Paid to you as a separate credit on 2026-07-24. <b>Not</b> netted against your invoice and <b>not</b> deducted from incremental revenue - deducting it from the increment would push the cost back onto you through a smaller billing base. Your July invoice is still NT$54,452. We raised the ceiling; you did not ask for it and did not approve it; we paid for it.' },
      revocable:{ who:'Already revoked, by us, on 2026-07-21',
        how:'Threshold reset to NT$800, and the auto-promotion path closed for widenings - see EVO-2607-05',
        effectOnPast:'<b>Nothing about the three refunds is recoverable.</b> Reverting a threshold does not reverse a payment. The three accounts are on the watchlist and all future refund and discount requests from them route to a human.' },
      reconcile:'Escalation and rollback reports <b>NT$1,805</b> of actual loss in July. That figure is correct as it stands: NT$1,138 (F-0729) plus NT$667 (F-0744), and it counts <b>execution failures</b>. This NT$3,980 is not an execution failure - nothing malfunctioned, the authority was wrong. Nor is the NT$11,271 make-good from RUN-2607-0774 in that figure.<br><br><b>Total cost of our own mistakes in July: NT$1,805 + NT$11,271 + NT$3,980 = NT$17,056. All of it borne by us. None of it in your invoice.</b>' },

    { id:'EVO-2607-05', cls:'metaRule', object:'rule promotion policy',
      title:'A change that widens Afu\'s authority can no longer be promoted from a pattern',
      status:'in force', direction:'narrower', at:'2026-07-21', isNew:true,
      trigger:{ kind:'failure', ids:['F-0736','EVO-2607-04'],
        detail:'Direct product of the entry above. The refund ceiling was widened on a reasonable reading of a real pattern, by a path that did not require you. The reading was reasonable and the outcome was still bad, <b>which means the problem was the path, not the reading.</b>' },
      enactedBy:'agent-inferred, auto-enacted (narrowing only)',
      scope:{ appliesTo:['Every threshold, gate, tool level and task classification'],
        excludes:['It does not stop Afu <i>proposing</i> a widening - all 9 items in your queue right now carry one',
          'It does not restrict narrowings: Afu can still tighten its own limits and tell you afterwards, which is what EVO-2607-02, EVO-2607-03 and EVO-2607-06 all did'] },
      before:'A repeated pattern of unedited approvals could promote itself into a permanent rule in either direction.',
      after:'Auto-promotion from a pattern may only <b>narrow</b>. Every widening needs your click, or your edit on a review item. The pattern still gets surfaced - it arrives as a proposal instead of as a fact.',
      effect:{ claim:'measured', num:8, den:9,
        text:'<b>8 of the 9</b> proposals now sitting in your queue would widen Afu\'s authority. Before 2026-07-21 some of them would have qualified for auto-promotion on exactly the logic that produced EVO-2607-04. They are all waiting on you instead. That is the effect, and it is <b>a count of things that did not happen by themselves.</b>' },
      cost:null,
      revocable:{ who:'Owner', how:'Governance centre', effectOnPast:'Nothing to undo - this rule has only ever prevented changes.' } },

    { id:'EVO-2607-06', cls:'memoryState', object:'19 memories, T-14 sweep',
      title:'Memory re-verification, 07-26: 19 re-checked, 3 downgraded, 1 invalidated',
      status:'in force', direction:'narrower', at:'2026-07-26 23:00',
      trigger:{ kind:'scheduled re-verification', ids:['T-14','EVT-2608-0322'],
        detail:'T-14 runs Sundays 23:00 - 2026-07-26 was a Sunday, and the next run is 2026-08-09 23:00. It re-reads every note Afu has taken and asks whether it still holds. It ran on Opus at NT$4.25, the most expensive single event in the sampled stream, and deliberately so: <b>it is the strong model auditing the agent\'s own beliefs.</b>' },
      enactedBy:'agent-inferred, auto-enacted (narrowing only)',
      scope:{ appliesTo:['19 of 187 memories in this sweep, selected by age since last verification and by citation volume'],
        excludes:['The 12 already invalid, which are frozen and not re-tested',
          'Human-reviewed health memories MEM-1877 and MEM-2044 - those are checked on every single use instead of weekly, which is stricter, not looser',
          'Memories under 7 days old, which have no new data to test against'] },
      before:'3 memories at their prior confidence; 1 free-shipping-threshold memory readable and citable.',
      after:'3 downgraded for insufficient confidence and demoted out of lead-argument use; 1 invalidated. Average confidence across the store now 86.4%.',
      effect:{ claim:'not isolable', num:4, den:187,
        text:'There is no revenue effect to claim here and <b>we are not going to invent one</b>. 4 of 187 memories (2.1%) were invalidated in July; 148 are verified, 27 unverified, 12 invalid. The only time the cost of a stale memory was actually measured, it was <b>NT$11,271</b> (MEM-0009). This sweep exists to make that number rarer, and one month is not enough to show that it did.' },
      cost:null,
      revocable:{ who:'Owner',
        how:'A downgrade can be overridden by setting confidence by hand; an invalidation can be reversed by re-verifying the memory. Both are audit events with your name on them.',
        effectOnPast:'Restoring a memory does not retroactively change decisions made while it was downgraded. A downgraded memory is not deleted - it can still be used as secondary support, the way MEM-0016 was used at 62% confidence in RUN-2607-0851. It just cannot be the claim Afu leads with.' },
      reconcile:'Two dating problems sat on this sweep and both were ours. <b>The first is now fixed:</b> nine memories recorded "last verified 2026-07-27", one day <i>after</i> the sweep that verified them; those nine dates now read 2026-07-26, matching the run. <b>The second is explained rather than edited:</b> the plain-language summary on EVT-2608-0322 attributes the one invalidation to "because you changed your shipping settings" - and that change is stamped 2026-07-28 14:02, two days later. See EVO-2607-07.' },

    { id:'EVO-2607-07', cls:'memoryState', object:'MEM-0007',
      title:'Free-shipping figure now NT$1,290, written from your Shopify settings rather than asserted',
      status:'in force', direction:'neutral', at:'2026-07-28 14:02',
      trigger:{ kind:'platform settings diff', ids:['MEM-0007','T-14'],
        detail:'You lowered the free-shipping threshold in Shopify. The daily settings.diff check caught it the same afternoon. Nobody told Afu; it read the platform.' },
      enactedBy:'agent-inferred, auto-enacted (narrowing only)',
      scope:{ appliesTo:['Every add-on pitch built on "get to free shipping"'],
        excludes:['The multi-pet household multiples in the same memory - 1.43x AOV and 2.21x bundle conversion - are backed by 1,847 orders and were untouched by the settings change'] },
      before:'A free-shipping memory asserting NT$1,500, with no settings-diff provenance attached - it had been stated once and never re-read from the platform.',
      after:'MEM-0007: NT$1,290, created 2026-07-28, last verified 2026-08-03, verification method "compared against the Shopify settings daily". The old figure cannot be reused - a pitch quoting NT$1,500 is refused at write time.',
      effect:{ claim:'too early to tell', num:null, den:null,
        text:'No effect claimed. This change is about being correct, not about lift. MEM-0007 was read 241 times in July with NT$81,216 of linked revenue, so the cost of it being wrong would have been material - <b>but we cannot show you a number for a mistake that did not happen.</b>' },
      cost:null,
      revocable:{ who:'Not meaningfully revocable', how:'The value is read from Shopify. Change the setting back and the memory follows within a day.',
        effectOnPast:'Messages already sent quoting NT$1,500 cannot be recalled. None were: the diff caught the change at 14:02 the same day.' },
      reconcile:'Here is the honest version of a three-way date clash, and the correction we owe.<br><br>T-14 ran <b>2026-07-26 23:00</b> and its record says it invalidated the free-shipping memory. Your Shopify change is stamped <b>2026-07-28 14:02</b>. MEM-0007 was created <b>2026-07-28</b> and is <b>last verified 2026-08-03</b> - which means <b>MEM-0007 was never in the 07-26 sweep at all</b>, and that is the thread that unpicks it.<br><br>The timestamps are right. <b>The explanation is wrong.</b> What actually happened: on 07-26 the sweep invalidated the <i>old</i> NT$1,500 memory because it had no platform provenance - it had been asserted, never re-read - which is the same defect that produced MEM-0009. Two days later you changed the setting, and the settings.diff wrote MEM-0007 as a new memory carrying platform provenance and the value NT$1,290.<br><br>The owner-facing summary on EVT-2608-0322 says the invalidation happened "because you changed your shipping settings", and that cause had not happened yet. That sentence is a post-hoc rationalisation written by the summariser, and it is the thing that needs correcting - not the timestamps, and not the sweep. <b>Per our own rule, the way to correct it is to add a record, not edit one:</b> both the original sentence and this correction stay visible.' },

    { id:'EVO-2607-08', cls:'threshold', object:'3 toggles, all still at off',
      title:'Three proposals you refused',
      status:'rejected', direction:'would have been wider', at:'2026-07-27 to 2026-07-30', isNew:true,
      trigger:{ kind:'queue item', ids:['Q-4427','Q-4439','Q-4445'],
        detail:'Three separate proposals to flip a toggle from off to on. All three were refused, and the reason you gave is recorded next to each one.' },
      enactedBy:'owner-authored (refusal)',
      rows:[
        { object:'inventory_lookup.exact', label:'Reveal exact stock counts', from:0, to:0, at:'2026-07-27', trigger:'Q-4427',
          why:'Afu\'s case: 1,042 shipping and stock questions in July, many of which "8 cans left" would end in one line. <b>Your answer: no.</b> Competitors read the storefront too, and a live count tells them exactly how fast you sell.' },
        { object:'discount_create.stack', label:'Can stack with free shipping or spend-threshold gifts', from:0, to:0, at:'2026-07-29', trigger:'Q-4439',
          why:'Afu\'s case: with the free-shipping line down to NT$1,290 (MEM-0007), stacking would close more small carts. <b>Your answer: no</b> - F-0729 was caused by codes stacking with free shipping when nobody meant them to, 40 went out, 6 could not be clawed back.' },
        { object:'product_copy_edit.lowrisk', label:'Allow autonomous edits to low-risk fields like FAQ', from:0, to:0, at:'2026-07-30', trigger:'Q-4445',
          why:'Afu\'s case: 33 product-copy items in July, all 33 escalated, <b>27 approved unchanged (81.8%)</b>, so the approval step was mostly ceremony. <b>Your answer: no</b>, and your reason was our own failure from two days earlier - F-0758, where an SEO description was silently truncated on a page nobody was looking at. Your note: "a silent change on a page I did not look at is exactly what I do not want."' }
      ],
      before:'All three toggles at 0.', after:'All three toggles still at 0.',
      effect:{ claim:'measured', num:3, den:14,
        text:'<b>3 of the 14</b> decisions taken in July were refusals. That is the number that matters on this page: <b>the veto is not decorative.</b> Note what happened next - Q-4469, sitting in your queue now, is the <b>scoped resubmission</b> of the third one: autonomous rewrites of the selling-point section only, on pages converting below half the site average, titles still requiring approval. A refusal narrowed the proposal instead of ending the conversation.' },
      cost:null,
      revocable:{ who:'Owner', how:'You can approve any of the three at any time - a refusal is not permanent, and none of them is one of the six hard-deny items',
        effectOnPast:'Nothing happened, so there is nothing to undo.' } },

    { id:'EVO-2607-09', cls:'taskClass', object:'T-08',
      title:'Afu asked to be downgraded: restock notification, Outbound to Maintenance',
      status:'awaiting decision', direction:'narrower', at:'2026-07-25',
      dueNote:'No SLA. This one is not urgent and it is not ours to force.',
      trigger:{ kind:'task run', ids:['RUN-2607-0902','MEM-0013'],
        detail:'This batch of restock notices sold <b>NT$116,440</b>. Of the 28 holdout customers who got nothing, 8 bought anyway - <b>28.6%</b>, against <b>28.7%</b> (82 / 286) for the ones who were notified. Increment +0.3 orders, 95% CI [-49.9, +50.4], contains zero. The success fee was <b>NT$0</b>. MEM-0013 says the same thing from a second direction: the median across 31 stores in the category is 27.1%, so this is not peculiar to this shop.' },
      enactedBy:'agent-inferred, proposed - awaiting owner decision',
      scope:{ appliesTo:['T-08 only'],
        excludes:['The notification itself is not being switched off - people want it',
          'The other 7 outbound tasks are unaffected; each is measured on its own holdout'] },
      before:'Type Outbound. Subject to the spend cap. Add-on copy attached to the notification.',
      after:'Proposed: type Maintenance, not subject to the cap, add-on copy removed.<br><b>Already in force without waiting for you:</b> the success fee on this task is 0 regardless of what you decide. A change that only reduces what we charge does not need your approval.',
      effect:{ claim:'measured', num:0, den:116440,
        text:'<b>NT$0 billed on NT$116,440 of gross revenue.</b> The effect of the reclassification itself is too early to tell, because this is <b>strike 2 of 2</b> and the rule has just fired. The second test came from June (RUN-2606-0817, p = 0.9659) and July (RUN-2607-0902, p = 0.9911), which are the two consecutive insignificant evaluated months the published rule requires. The next restock event, FD-S05, is expected 2026-08-06.<br><br>Worth reading alongside T-07 on the track record: <b>the same rule fired there in April, the task was switched off, and two months later it was reinstated with a mechanism and is now the strongest signal in the record.</b> Firing is a recommendation, not a verdict.' },
      cost:null,
      revocable:{ who:'Owner, before or after', how:'One setting on Tasks and schedule',
        effectOnPast:'If you approve the downgrade and later revert it, billing eligibility resumes <b>prospectively only</b>. We will not go back and bill the NT$116,440.' },

/* ============================================================
   Chart engine — pure SVG, no external dependencies, no CDN
   Palette = the design system's brand-derived categorical scale, re-lifted for the
   dark plot ground and re-validated locally with OKLab ΔE + Machado CVD simulation.
   These must stay in sync with --cat-* / --seq-* in the token block above:
     · Contrast on a card (#202020) 5.20–7.12:1 (all 6 clear 3:1)
     · Adjacent pairs: worst normal-vision ΔE 15.5 (floor 15) / worst CVD 12.7 (floor 8)
     · All-pairs passes for the first 3 slots only (CVD 8.3); it collapses to 2.2 from
       slot 4 onward → hard series cap of 3 for scatter/bubble forms
     · Status colours sit only 3.2–9.2 ΔE from cat-2/3/5, so a single chart never
       mixes status markers with those slots
   Mark specs: 2px round lines / end markers r≥4 with a 2px surface ring /
   bars ≤24px with a 4px rounded data-end
   Gridlines are always 1px solid (never dashed); the holdout control group uses
   neutral grey + a dashed stroke so identity is never colour-alone
   Every chart ships a chart/table toggle — values never live only in a tooltip
   ============================================================ */
const VIZ = {
  s1: '#6fa8c9', s2: '#d1a544', s3: '#db6f92',
  s4: '#9d8ce6', s5: '#9ab456', s6: '#c479b8',
  surface: '#202020',            /* must equal --surface-1: it rings the end markers */
  grid: '#2d2d2b', axis: '#474642',
  muted: '#97948e', ink: '#e8e5e0', ink2: '#adaba5',
  neutral: '#97948e',            /* holdout: chroma 0.008 — reads as a baseline, not a series */
  good: '#4faa72', warn: '#c99a3d', crit: '#d0685e'
};
const MAX_ALLPAIRS_SERIES = 3;   /* all-pairs safe ceiling; never exceed on scatter forms */

const NS = 'http://www.w3.org/2000/svg';
function el(name, attrs, parent) {
  const n = document.createElementNS(NS, name);
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function nf(n, d) {
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
}
/** Round axis ticks to clean numbers: 0 / 20,000 / 40,000 */
function niceTicks(max, count) {
  count = count || 4;
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  /* Guard: max = 0 makes step 0 and the loop below never advances (it locks the tab);
     a negative max makes step NaN and returns [], which blanks the chart with no error. */
  if (!isFinite(step) || step <= 0) return [0, 1];
  const ticks = [];
  for (let v = 0; v <= max + step * 0.001; v += step) ticks.push(v);
  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}

/* ---------- Shared floating tooltip (single instance) ---------- */
let _tip;
function tipEl() {
  if (!_tip) {
    _tip = document.createElement('div');
    _tip.className = 'chart__tip';
    _tip.setAttribute('role', 'status');
    document.body.appendChild(_tip);
  }
  return _tip;
}
function showTip(html, x, y) {
  const t = tipEl();
  t.innerHTML = html;
  t.classList.add('is-on');
  const r = t.getBoundingClientRect();
  let left = x + 14, top = y - r.height / 2;
  if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
  if (top < 8) top = 8;
  if (top + r.height > window.innerHeight - 8) top = window.innerHeight - r.height - 8;
  t.style.left = left + 'px';
  t.style.top = top + 'px';
}
function hideTip() { if (_tip) _tip.classList.remove('is-on'); }

/* ============================================================

function lineChart(host, cfg) {

    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 0.18);
    dots.forEach((dt, k) => {
      dt.setAttribute('cx', X(i)); dt.setAttribute('cy', Y(cfg.series[k].values[i])); dt.setAttribute('opacity', 1);
    });
    const rows = cfg.series.map(s =>
      `<div class="chart__tiprow"><span class="chart__tipkey" style="background:${s.color}${s.dash ? ';opacity:.75' : ''}"></span>${s.name}<b>${cfg.yFmt ? cfg.yFmt(s.values[i]) : nf(s.values[i])}</b></div>`
    ).join('');
    const box = host.getBoundingClientRect();
    showTip(`<div class="chart__tiphd">${cfg.x[i]}</div>${rows}${cfg.tipExtra ? cfg.tipExtra(i) : ''}`,
      cx != null ? cx : box.left + (X(i) / W) * box.width,
      cy != null ? cy : box.top + box.height / 2);
  }
  function clear() {
    cross.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0)); hideTip(); cur = -1;
  }
  hit.addEventListener('mousemove', e => {
    const box = svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    let i = Math.round(((px - m.l) / iw) * (n - 1));
    focus(Math.max(0, Math.min(n - 1, i)), e.clientX, e.clientY);
  });
  hit.addEventListener('mouseleave', clear);
  hit.addEventListener('blur', clear);
  hit.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    const i = cur < 0 ? 0 : cur + (e.key === 'ArrowRight' ? 1 : -1);
    focus(Math.max(0, Math.min(n - 1, i)));
  });
}

/* ============================================================
   Horizontal bar chart — one series, one colour
   (never a value ramp: that would double-encode length as hue)
   ============================================================ */
function barsH(host, cfg) {
  host.innerHTML = '';
  const rows = cfg.rows;
  const rowH = 34, W = host.clientWidth || 640;
  const H = rows.length * rowH + 26;
  const labW = cfg.labelWidth || (W < 560 ? 132 : 200);
  const valW = 108;
  const iw = Math.max(60, W - labW - valW);
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H, role: 'img',
    'aria-label': cfg.aria || 'Bar chart. A table view is also available.' }, host);
  const max = Math.max.apply(null, rows.map(r => r.value));
  const ticks = niceTicks(max, 3);
  const xmax = ticks[ticks.length - 1];

  ticks.forEach(t => {
    if (!t) return;
    const x = labW + (t / xmax) * iw;
    el('line', { x1: x, x2: x, y1: 6, y2: rows.length * rowH + 2, stroke: VIZ.grid, 'stroke-width': 1,
      'shape-rendering': 'crispEdges' }, svg);
    const tx = el('text', { x, y: H - 6, 'text-anchor': 'middle', class: 'chart__tick' }, svg);
    tx.textContent = cfg.xFmt ? cfg.xFmt(t) : nf(t);
  });
  el('line', { x1: labW, x2: labW, y1: 6, y2: rows.length * rowH + 2, stroke: VIZ.axis, 'stroke-width': 1,
    'shape-rendering': 'crispEdges' }, svg);

  rows.forEach((r, i) => {
    const bh = Math.min(20, rowH - 14);
    const y = i * rowH + (rowH - bh) / 2 + 6;
    const w = Math.max(3, (r.value / xmax) * iw);
    const lab = el('text', { x: labW - 12, y: y + bh / 2 + 4, 'text-anchor': 'end', class: 'chart__cat' }, svg);
    lab.textContent = r.label;
    /* 4px rounded data-end, square at the baseline */
    el('path', {
      d: `M${labW} ${y} H${labW + w - 4} a4 4 0 0 1 4 4 V${y + bh - 4} a4 4 0 0 1 -4 4 H${labW} Z`,
      fill: r.color || VIZ.s1, 'fill-opacity': r.muted ? 0.42 : 1
    }, svg);
    const vt = el('text', { x: labW + w + 10, y: y + bh / 2 + 4, class: 'chart__val' }, svg);
    vt.textContent = cfg.vFmt ? cfg.vFmt(r.value) : nf(r.value);
    const target = el('rect', { x: labW, y: i * rowH + 6, width: iw, height: rowH - 2, fill: 'transparent' }, svg);
    target.addEventListener('mousemove', e => showTip(
      `<div class="chart__tiphd">${r.label}</div><div class="chart__tiprow"><span class="chart__tipkey" style="background:${r.color || VIZ.s1}"></span>${cfg.seriesName || 'Value'}<b>${cfg.vFmt ? cfg.vFmt(r.value) : nf(r.value)}</b></div>${r.note ? `<div class="chart__tipnote">${r.note}</div>` : ''}`,
      e.clientX, e.clientY));
    target.addEventListener('mouseleave', hideTip);
  });
}

/* ============================================================
   Dot plot — cross-store benchmark (you vs median vs top 25%)
   All three markers carry a 2px surface ring so they stay readable when they overlap
   ============================================================ */
function dotPlot(host, cfg) {
  host.innerHTML = '';

  rows.forEach((r, i) => {

      'shape-rendering': 'crispEdges' }, svg);
    const lab = el('text', { x: labW - 12, y: y + 4, 'text-anchor': 'end', class: 'chart__cat' }, svg);
    lab.textContent = r.label;
    [{ v: r.median, hollow: false, c: VIZ.neutral, rr: 4 },
     { v: r.top25, hollow: true, c: VIZ.neutral, rr: 4 },

    ].forEach(p => {
      el('circle', { cx: X(p.v), cy: y, r: p.rr + 2, fill: VIZ.surface }, svg);
      el('circle', { cx: X(p.v), cy: y, r: p.rr, fill: p.hollow ? VIZ.surface : p.c,

    });
    const vt = el('text', { x: W - 8, y: y + 4, 'text-anchor': 'end', class: 'chart__val' }, svg);
    vt.textContent = r.fmt(r.you);

    hitR.addEventListener('mousemove', e => showTip(
      `<div class="chart__tiphd">${r.label}</div>` +
      `<div class="chart__tiprow"><span class="chart__tipkey" style="background:${VIZ.s1}"></span>Furday<b>${r.fmt(r.you)}</b></div>` +
      `<div class="chart__tiprow"><span class="chart__tipkey" style="background:${VIZ.neutral}"></span>Category median<b>${r.fmt(r.median)}</b></div>` +
      `<div class="chart__tiprow"><span class="chart__tipkey chart__tipkey--hollow"></span>Top 25% threshold<b>${r.fmt(r.top25)}</b></div>` +
      `<div class="chart__tipnote">${r.note}</div>`, e.clientX, e.clientY));
    hitR.addEventListener('mouseleave', hideTip);
  });
}

/* ============================================================
   Chart card shell — title / legend / chart↔table toggle
   The table view is a required equivalent: values never live only in a tooltip
   ============================================================ */
function chartCard(host, opts) {
  host.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'chart';
  card.innerHTML = `
    <div class="chart__head">
      <div>
        <h4 class="chart__title">${opts.title}</h4>
        ${opts.sub ? `<p class="chart__sub">${opts.sub}</p>` : ''}
      </div>
      <div class="chart__ctl">
        ${opts.legend && opts.legend.length > 1 ? `<div class="chart__legend">${opts.legend.map(l =>
    `<span class="chart__lgd"><span class="chart__key ${l.dash ? 'chart__key--dash' : ''} ${l.hollow ? 'chart__key--hollow' : ''}" style="--k:${l.color}"></span>${l.name}</span>`).join('')}</div>` : ''}
        <div class="seg">
          <button class="seg__b is-on" type="button" aria-pressed="true">Chart</button>
          <button class="seg__b" type="button" aria-pressed="false">Table</button>
        </div>
      </div>
    </div>
    <div class="chart__body"><div class="chart__plot"></div><div class="chart__table" hidden></div></div>
    ${opts.foot ? `<p class="chart__foot">${opts.foot}</p>` : ''}`;
  host.appendChild(card);
  const plot = card.querySelector('.chart__plot');
  const table = card.querySelector('.chart__table');
  /* Always wrap tables in .table-wrap for horizontal scroll — body locks overflow-x, so an unwrapped table gets clipped */
  table.innerHTML = opts.table ? `<div class="table-wrap">${opts.table}</div>` : '';
  const btns = card.querySelectorAll('.seg__b');
  function sw(on) {
    btns[0].classList.toggle('is-on', on); btns[1].classList.toggle('is-on', !on);
    btns[0].setAttribute('aria-pressed', String(on)); btns[1].setAttribute('aria-pressed', String(!on));
    plot.hidden = !on; table.hidden = on;
    if (on) opts.draw(plot);
  }
  btns[0].addEventListener('click', () => sw(true));
  btns[1].addEventListener('click', () => sw(false));
  opts.draw(plot);
  /* Redraw when the container resizes (height grows with content so x-axis labels are never clipped outside it) */
  if (window.ResizeObserver) {
    let w = plot.clientWidth;
    new ResizeObserver(() => {
      if (plot.hidden) return;
      if (Math.abs(plot.clientWidth - w) > 12) { w = plot.clientWidth; opts.draw(plot); }
    }).observe(plot);
  }
  return card;
}
/* ============================================================
   Render layer. Every screen is derived from MODEL / GOV / CONTENT —
   there is not a single hard-coded number in the markup.
   ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const el2 = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const M = MODEL, P = M.pricing, R = M.result, A = M.automation, C = M.cost;
const THRESHOLD_COUNT = GOV.tools.reduce((a, t) => a + t.thresholds.length, 0);

/* ---------- Formatting ---------- */
const f0 = n => Math.round(n).toLocaleString('en-US');
const f1 = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const f2 = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nt = n => 'NT$' + f0(n);
/** Small and per-person amounts must keep their decimals — a NT$0.31 tool cost
    rounded to NT$0 would destroy the whole point of cost transparency. */
const nt2 = n => 'NT$' + f2(n);
const pct = n => f1(n) + '%';
/** Every ratio ships with its numerator and denominator. Site-wide rule, not decoration. */
const basis = (num, den, label) => `${label || ''}${f0(num)} / ${f0(den)}`;

/* ---------- Badge mapping, tolerant of either source language ---------- */
const riskCls = r => /high/i.test(r) ? 'high' : /med/i.test(r) ? 'medium' : 'low';
const riskWord = r => /high/i.test(r) ? 'High' : /med/i.test(r) ? 'Medium' : 'Low';
const memTypeCls = t => /product/i.test(t) ? 'info' : /prefer/i.test(t) ? 'accent'
  : /rule/i.test(t) ? 'neutral' : 'positive';
const memStatCls = s => /invalid/i.test(s) ? 'danger' : /unverified/i.test(s) ? 'warning' : 'positive';
const runStatCls = s => /roll/i.test(s) ? 'danger' : /progress/i.test(s) ? 'info'
  : /approval/i.test(s) ? 'warning' : /not significant/i.test(s) ? 'neutral' : 'positive';
const taskTypeCls = t => /outbound/i.test(t) ? 'accent' : /service/i.test(t) ? 'positive'
  : /analys/i.test(t) ? 'info' : 'neutral';
const tierCls = t => /not reversible|irreversible/i.test(t) ? 'danger'
  : /compensa/i.test(t) ? 'warning' : 'positive';
const auditNode = t => /block|intercept/i.test(t) ? 'error'
  : /approval|escalat/i.test(t) ? 'warn' : /rule/i.test(t) ? 'open' : 'ok';
const slaUrgent = s => /\bmin\b|minute|overdue/i.test(s);

function card(parent, inner, cls) {

function kpi(o) {

}
/** Table builder — column 0 is the label, every other column is numeric (right-aligned, tabular) */
function tbl(head, rows, total) {

}

Effective holdout                <b>${f0(PV.finalHoldout)}</b> (${pct(PV.finalPct)})

RENDER.person = (host, arg) => {
  const CU = CONTENT.customers;
  if (!CU) return;
  const b = section(host, 'Customer audit trail',
    'One person, end to end. The same immutable record the rest of this platform keeps, pivoted from task to person: which group they are in and why, every message we sent them and every message the rules stopped us sending, what we believe about them, and exactly how their money enters your invoice. <b>This is not a customer database</b> &mdash; your customer database is Shopify\'s, and we link to it.');

  const found = arg ? CU.records.filter(r => r.id === arg)[0] : null;

  const sw = el2('div', 'search u-mb-3');
  sw.innerHTML = `<input class="input" type="search" placeholder="Customer ID, order number, or a complete email or phone number" aria-label="Look up one customer">`;
  b.appendChild(sw);

  const res = el2('div');
  b.appendChild(res);

  const paint = term => {
    res.innerHTML = '';
    const t = (term || '').trim().toLowerCase();
    const hits = !t ? [] : CU.records.filter(r =>
      r.id.toLowerCase() === t || r.name.toLowerCase().indexOf(t) >= 0 ||
      r.orders.some(o => o.id.toLowerCase() === t));
    if (!t) {
      res.innerHTML = `<div class="card"><div class="card__body">
        <h4>Look up one customer</h4>
        <p class="u-t-sm u-secondary u-mt-2">${CU.lookup.noList}</p>
        <div class="table-wrap u-mt-4">${tbl(['How', 'Example', 'Matching'],
          CU.lookup.methods.map(m => [m.label, `<span class="u-mono u-t-xs">${m.example}</span>`, m.match]))}</div>
        <p class="u-t-sm u-muted u-mt-3">${CU.lookup.primaryPathNote}</p>
        <div class="u-mt-4"><div class="u-caps u-muted">Four records worth reading first</div>
          <div class="u-flex u-wrap u-gap-2 u-mt-2">${CU.records.map(r =>
            `<a class="chip chip--link chip--mono" href="#person/${r.id}">${r.id} &middot; ${r.headline.slice(0, 46)}&hellip;</a>`).join('')}</div></div>
        <div class="u-mt-4">${callout(CU.lookup.rateLimits.why, `Lookup limits: ${CU.lookup.rateLimits.perActorPerDay} a day before you have to type a reason`, 'quiet')}</div>
        <div class="u-mt-3">${callout(CU.driftTest, 'The test that keeps this page from becoming a CRM', 'quiet')}</div>
      </div></div>`;
      return;
    }
    if (hits.length === 0) {
      res.innerHTML = `<div class="card"><div class="card__body"><h4>No exact match</h4>
        <p class="u-t-sm u-secondary u-mt-2">Partial matches return nothing on purpose. ${CU.lookup.methods[2].match}</p></div></div>`;
      return;
    }
    if (hits.length > 1) {
      res.innerHTML = `<div class="card"><div class="card__body">
        <h4>${f0(hits.length)} customers match. None are shown.</h4>
        <p class="u-t-sm u-secondary u-mt-2">Narrow it to one. ${CU.lookup.noList}</p></div></div>`;
      return;
    }
    renderCustomerRecord(res, hits[0]);
  };

  $('input', sw).addEventListener('input', e => paint(e.target.value));
  if (found) { $('input', sw).value = found.id; paint(found.id); } else paint('');

  const cb2 = section(host, 'Access, and what we refused to build',
    'Two lists. What each role can do, and the features this surface deliberately does not have.');
  card(cb2, `<div class="table-wrap">${tbl(['Who', 'Can', 'Cannot'],
    CU.lookup.access.map(a => [a.actor, a.can, a.cannot]))}</div>
    <p class="u-t-sm u-muted u-mt-3">${CU.lookup.exportPolicy}</p>`);
  card(cb2, `<h4>Refused features, and the reason for each</h4>
    <div class="table-wrap u-mt-4">${tbl(['Not built', 'Why not'], CU.refused.map(x => [x.item, x.why]))}</div>`);
};

/* Trailing track record -> Revenue impact */
function renderTrackRecord(host) {
  const H2 = M.history;
  if (!H2) return;
  const T2 = H2.trailing, ms = H2.months;
  const b = section(host, 'Trailing track record &mdash; six settled months',
    'One month tells you almost nothing. Six months tell you more, and they tell you something less flattering than any single month would: <b>the increment moves by more than three times between our best month and our worst, and one month in six earned us nothing at all.</b>');

  const g = el2('div', 'kpi-grid');
  g.innerHTML = [
    kpi({ label: 'Increment over six months', prefix: 'NT$', value: f0(T2.totalPoint),
      basis: `95% interval ${nt(T2.pooledCi95Low)} to ${nt(T2.pooledCi95High)} &middot; &plusmn;${pct(T2.pooledHalfWidthPct)}` }),
    kpi({ label: 'You paid, all in', prefix: 'NT$', value: f0(T2.totalCharge),
      basis: `${nt(T2.totalFee)} success fees + ${nt(T2.totalSub)} subscription` }),
    kpi({ label: 'Realised fee rate', value: pct(T2.realisedFeeRatePct),
      basis: `${basis(T2.totalFee, T2.totalPoint)} &middot; against headline rates of 18% then 12%` }),
    kpi({ label: 'Months we billed a success fee', value: f0(T2.significantMonths), unit: 'of ' + f0(T2.months),
      basis: `${f0(T2.insignificantMonths)} month not significant &rarr; subscription only &middot; ${f0(T2.monthsPinnedAtCap)} months pinned at the cap` })
  ].join('');
  b.appendChild(g);

  /* Point estimate with its 95% band. May's lower bound is negative; the band clamps at
     zero for drawing and the true figure stays in the table. Said out loud in the foot. */
  const ch = el2('div'); b.appendChild(ch);
  chartCard(ch, {
    title: 'Monthly increment, with the 95% interval around each estimate',
    sub: 'The band is the interval, not a forecast. Where it is wide, we know less.',
    legend: [
      { name: 'Increment (point estimate)', color: VIZ.s1 },
      { name: '95% interval', color: VIZ.s1, hollow: true },
      { name: 'What you were charged', color: VIZ.neutral, dash: true }
    ],
    foot: `Holdout re-assigned 1 July 2026 (salt ${H2.eras.filter(e => e.key === 'B')[0].salt} &rarr; ${H2.eras.filter(e => e.key === 'C')[0].salt}). Below that line the control group is different people. <b>Each month either side is a valid measurement of that month; reading a trend across the line is not, and we have not drawn one.</b> May's lower bound is negative (${nt(ms[3].ci95Low)}) &mdash; the band is clamped at zero for drawing and the real figure is in the table.`,
    table: tbl(['Month', 'Assignment', 'Plan', 'Holdout', 'Exposed', 'Lift / person', 'Increment', 'Std. error', '95% interval', 'p', 'Verdict', 'Billing base', 'Fee', 'You paid', 'Cap used'],
      ms.map(m => [m.label, m.era, m.plan, `${f0(m.holdoutN)} / ${f0(m.eligible)}`, f0(m.exposedN),
        nt2(m.perUserLift), nt(m.point), nt(m.seTotal), `[${nt(m.ci95Low)}, ${nt(m.ci95High)}]`,
        f2(m.p * 100) === '0.00' ? m.p.toFixed(4) : m.p.toFixed(4),
        m.significant ? '<span class="badge badge--positive">significant</span>' : '<span class="badge badge--warning">not significant</span>',
        nt(m.billingBase), nt(m.fee), nt(m.total), pct(m.capPct)]),
      ['Total', '', '', '', '', '', nt(T2.totalPoint), nt(T2.pooledSeTotal), `[${nt(T2.pooledCi95Low)}, ${nt(T2.pooledCi95High)}]`, '', `${f0(T2.significantMonths)} / ${f0(T2.months)}`, nt(T2.totalBillingBase), nt(T2.totalFee), nt(T2.totalCharge), '']),
    draw: p => lineChart(p, {
      x: ms.map(m => m.label), height: 300, tickCount: 4,
      yFmt: v => v >= 1000 ? (v / 1000).toFixed(0) + 'k' : f0(v),
      series: [
        { name: 'Increment', values: ms.map(m => m.point), color: VIZ.s1,
          band: { hi: ms.map(m => m.ci95High), lo: ms.map(m => Math.max(0, m.ci95Low)) } },
        { name: 'What you were charged', values: ms.map(m => m.total), color: VIZ.neutral, dash: true, endLabel: false }
      ],
      marks: [{ i: ms.length - 1, label: 'holdout re-based' }],
      tipExtra: i => `<div class="chart__tipnote">${ms[i].significant
        ? `p = ${ms[i].p.toFixed(4)} &middot; billing base <b>${nt(ms[i].billingBase)}</b>`
        : `<b>p = ${ms[i].p.toFixed(4)} &mdash; not significant, success fee ${nt(0)}</b>`}<br>95% interval ${nt(ms[i].ci95Low)} to ${nt(ms[i].ci95High)}</div>`
    })
  });

  b.appendChild(el2('div', '', callout(
    `${T2.whatItProves}<br><br><b>Two things it does not prove.</b> ${T2.pooledCaveat}<br><br>${T2.whatItDoesNot}<br><br>And the row we would point at if you only read one: <b>${ms[3].label} was your highest-revenue month of the six and your lowest increment month, and we charged you ${nt(ms[3].total)}.</b> ${ms[3].note}`,
    'What six months of this does and does not prove', 'warn')));

  card(b, `<h4>Why there is a line through the middle of that table</h4>
    <p class="u-t-sm u-secondary u-mt-2">${H2.eraNote}</p>

      <p class="u-t-xs u-muted u-mt-3">${CR.bodyLabel}</p>
      <div class="dual__c dual__c--eng u-mt-3">${r.body}</div>
      <p class="u-t-xs u-muted u-mt-2">${CR.coverageNote}</p>
      <div class="u-mt-4"><div class="u-caps u-muted">Claim provenance &mdash; ${f0(r.claims.length)} spans</div>
        <div class="table-wrap u-mt-2">${tbl(['Claim (as sent)', 'English gloss', 'Backing', 'If it were downgraded', 'If it were invalidated'],
          r.claims.map(cl => [
            `<span class="u-mono u-t-xs">${cl.id}</span><br>${cl.text}`,
            `<span class="u-t-xs">${cl.gloss}</span>`,
            `<span class="badge badge--${(CR.legend.filter(l => l.key === cl.state)[0] || { badge: 'neutral' }).badge}">${cl.state}</span>` +
              (cl.memory ? `<br><a class="chip chip--link chip--mono u-mt-1" href="#memory">${cl.memory}</a>` : '') +
              (cl.confidence != null ? `<br><span class="u-t-xs u-muted">${cl.confidence}% &middot; verified ${cl.verifiedOn || 'never'}</span>` : '') +
              (cl.source ? `<br><span class="u-t-xs u-muted">${cl.source}</span>` : '') +
              (cl.atSendTime ? `<br><span class="u-t-xs u-muted"><b>At send time:</b> ${cl.atSendTime}</span>` : '') +
              (cl.today ? `<br><span class="u-t-xs">${cl.today}</span>` : ''),
            cl.ifDowngraded || '&mdash;', cl.ifInvalidated || cl.note || '&mdash;']))}</div></div>
      <div class="u-mt-4"><div class="u-caps u-muted">Compliance check ${co.id}</div>
        <div class="calc u-mt-2">${co.costSplit.map(x => `${x.part.padEnd(34)} ${x.model.padEnd(28)} ${nt2(x.cost)}`).join('\n')}
${''.padEnd(34)} ${''.padEnd(28)} ${nt2(co.cost)}</div>
        <p class="u-t-sm u-secondary u-mt-2">${co.costSplitNote}</p>
        <div class="table-wrap u-mt-3">${tbl(['#', 'Check', 'Type', 'Result', 'Detail'],
          (co.checks || []).map(x => [f0(x.n), `<span class="u-mono u-t-xs">${x.key}</span>`, x.type,
            `<span class="badge badge--${x.result === 'pass' ? 'positive' : x.result === 'finding' ? 'warning' : 'danger'}">${x.result}</span>`, x.detail]))}</div></div>
      ${co.rewrite ? `<div class="u-mt-4"><div class="u-caps u-muted">The check that forced a rewrite</div>
        <div class="dual u-mt-2">
          <div class="dual__c"><div class="dual__l">Draft 1 &mdash; blocked</div>
            <div class="turn__txt">${co.rewrite.v1}</div>
            <p class="u-t-xs u-muted u-mt-2">${co.rewrite.v1Gloss}</p></div>
          <div class="dual__c"><div class="dual__l">Draft 2 &mdash; as sent</div>
            <p class="u-t-sm u-mt-2">${co.rewrite.v2Gloss}</p></div>
        </div>
        <div class="method__list u-mt-3">${co.rewrite.reasons.map(x => `<li>${x}</li>`).join('')}</div>
        <p class="u-t-sm u-secondary u-mt-3">${co.rewrite.delta}</p>
        <div class="u-mt-3">${callout(co.rewrite.note, null, 'warn')}</div></div>` : ''}
      ${co.thenNow ? `<div class="u-mt-4"><div class="u-caps u-muted">What this record showed at send time, and what it shows now</div>
        <div class="table-wrap u-mt-2">${tbl(['Check', 'Then', 'Now'],
          co.nowChecks.map(nc => { const t = (co.thenChecks || []).filter(x => x.key === nc.key)[0];
            return [`<span class="u-mono u-t-xs">${nc.key}</span>`,
              t ? `<span class="badge badge--positive">${t.result}</span> ${t.detail}` : '<span class="u-muted">did not exist</span>',
              `<span class="badge badge--danger">${nc.result}</span> ${nc.detail}`]; }))}</div>
        <div class="u-mt-3">${callout(co.thenNow, null, 'warn')}</div>
        <p class="u-t-sm u-muted u-mt-2">Detection then: ${co.detectionThen} &middot; Target: ${co.detectionTarget}</p></div>` : ''}
      ${r.controlArgument ? `<div class="u-mt-4"><div class="u-caps u-muted">Which control actually prevents this</div>
        <div class="method__dl u-mt-2">
          <dt>What we shipped</dt><dd>${r.controlArgument.shipped}</dd>
          <dt>Our verdict on it</dt><dd><b>${r.controlArgument.verdict}</b> ${r.controlArgument.why}</dd>
          <dt>Is freshness the answer?</dt><dd>${r.controlArgument.freshnessVerdict}</dd>
        </div>
        <div class="table-wrap u-mt-3">${tbl(['#', 'Control', 'Status', 'Strength', 'What it does'],
          r.controlArgument.layers.map(l => [f0(l.n), l.name,
            `<span class="badge badge--${/Shipped/.test(l.status) ? 'positive' : /Missing/.test(l.status) ? 'warning' : 'neutral'}">${l.status}</span>`,
            l.strength, l.detail]))}</div>
        <div class="u-mt-3">${callout(r.controlArgument.conclusion, 'Prefer unrepresentable over detectable', 'warn')}</div></div>` : ''}
      ${r.gaps ? `<div class="u-mt-4"><div class="u-caps u-muted">Known gaps in this record</div>
        <div class="table-wrap u-mt-2">${tbl(['Gap', 'What is missing'], r.gaps.map(g => [`<span class="u-mono u-t-xs">${g.id}</span>&ensp;${g.title}`, g.detail]))}</div></div>` : ''}`;
    c.appendChild(cb); b.appendChild(c);
  });
}

function renderFreqCap(host) {
  const FC = CONTENT.frequencyCap;
  if (!FC) return;
  const b = section(host, 'What the 2-contacts cap cost you',
    `${f0(FC.blockedSends)} refused sends, ${f0(FC.distinctCustomers)} customers, ${nt(FC.byTaskTotal.forgone)} central estimate &mdash; <b>and why the obvious multiplication gives the wrong answer.</b>`);
  card(b, `<h4>Assumptions, stated before the table</h4>
    <div class="method__list u-mt-3">${FC.assumptions.map(a => `<li>${a.text}</li>`).join('')}</div>`);
  card(b, `<div class="table-wrap">${tbl(['Task', 'Attempted', 'Delivered', 'Blocked', 'Block rate', 'Est. increment forgone'],
      FC.byTask.map(t => [`<span class="u-mono u-t-xs">${t.id}</span>&ensp;${t.name}${t.note ? `<br><span class="u-t-xs u-muted">${t.note}</span>` : ''}`,
        f0(t.attempted), f0(t.delivered), f0(t.blocked), pct(t.ratePct), nt(t.forgone)]),
      ['Total', f0(FC.byTaskTotal.attempted), f0(FC.byTaskTotal.delivered), f0(FC.byTaskTotal.blocked),
       pct(FC.byTaskTotal.ratePct), nt(FC.byTaskTotal.forgone)])}</div>
    <div class="calc u-mt-4">${FC.forgoneArith}</div>
    <p class="u-t-xs u-muted u-mt-2">${FC.roundingNote}</p>
    <div class="table-wrap u-mt-4">${tbl(['r &mdash; ' + FC.sensitivity.parameter, 'Reading', 'Forgone'],
      FC.sensitivity.rows.map(x => [f2(x.r) + (x.current ? ' <span class="badge badge--info">central</span>' : ''),
        x.label + (x.note ? `<br><span class="u-t-xs u-muted">${x.note}</span>` : ''), nt(x.forgone)]))}</div>
    <div class="u-mt-3">${callout(FC.sensitivity.honesty, 'Note the direction of our interest', 'warn')}</div>
    <div class="u-mt-3">${callout(FC.floorWarning, '1,247 is a floor', 'warn')}</div>
    <p class="u-t-sm u-muted u-mt-3">${FC.windowNote}</p>`);
  card(b, `<h4>Both restraint costs, side by side</h4>
    <div class="table-wrap u-mt-4">${tbl(['What we gave up on purpose', 'Cost', 'Note'],
      FC.context.map(c => [c.item, nt(c.value), c.note]))}</div>`);
  card(b, `<h4>${FC.finding.title}</h4>
    <p class="u-t-sm u-secondary u-mt-2">${FC.finding.detail}</p>
    <div class="u-mt-3">${callout(FC.finding.disclosure, 'This one earns us money', 'warn')}</div>`);
  card(b, `<h4>${FC.experiment.title}</h4>
    <div class="method__dl u-mt-3">
      <dt>Design</dt><dd>${FC.experiment.design}</dd>
      <dt>What it costs</dt><dd>${FC.experiment.cost}</dd>
      <dt>Our interest in it</dt><dd>${FC.experiment.ourInterest}</dd>
    </div>`);
}

/* Decorate the existing renderers rather than editing them. */
[['value', renderTrackRecord], ['pricing', renderMarginLens], ['attrib', renderBillability],
 ['ladder', renderServiceQuality], ['tasks', renderCreative], ['tasks', renderFreqCap]
].forEach(pair => {
  const prev = RENDER[pair[0]], add = pair[1];
  RENDER[pair[0]] = host => { prev(host); add(host); };
});

/* ============================================================
   Boot
   ============================================================ */
renderNav();
renderCap();
renderMethodStrip();
go(location.hash.slice(1) || 'value');
</script></body></html>
