<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afu · Revenue Partner Console — Furday Pet Life</title>
<meta name="description" content="A performance-priced AI sales agent platform for Shopify merchants. Increments verified against a holdout control group, success fees charged on incremental revenue only, and an append-only audit trail.">
<style>
/* ==========================================================================
   MERCHANT REVENUE AGENT — DESIGN SYSTEM (light theme, single file, no deps)
   Order: reset → tokens → base → layout → components → utilities → responsive → print
   ========================================================================== */

/* ==========================================================================
   1. RESET
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body, h1, h2, h3, h4, h5, h6, p, figure, blockquote, dl, dd, ul, ol, pre { margin: 0; }
ul[class], ol[class] { list-style: none; padding: 0; }
img, svg, video, canvas { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; margin: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th { text-align: left; font-weight: 600; }
fieldset { border: 0; padding: 0; margin: 0; }
summary { cursor: pointer; }
[hidden] { display: none !important; }

/* ==========================================================================
   2. TOKENS
   -------------------------------------------------------------------------
   A single dark (graphite) theme. Every component reads only the semantic-layer
   variables (--surface-* / --text-* / --border-*), so the theme lives entirely in
   this block — component CSS is untouched by the light→dark switch.

   Two conventions this build follows:
     · Elevation reads as *lighter*, not shadowed. Dark shadows barely register on a
       dark floor, so the ladder page → card → recessed → deep does the work, and
       --sh-2/--sh-3 carry a 1px inset top highlight to catch the edge of a surface.
     · The 9-step ramps keep their light-theme roles (100–300 fills, 400–500 lines,
       600–900 text) and only invert lightness — so --gray-100 is now the darkest
       step and --gray-900 the lightest. Raw-token call sites stay correct as-is.
   ========================================================================== */
:root {
  color-scheme: dark;

  /* ---- Neutral graphite ramp, 9 steps ------------------------------------------
     Near-neutral with a whisper of warmth (R−B delta 2–6). Deliberately not a cool
     blue-gray: the slight warmth keeps large dark areas reading as material rather
     than as a screen, and leaves the ink-blue accent the only real hue on the page. */
  --gray-100: #202020;  --gray-200: #2d2d2b;  --gray-300: #3a3a37;
  --gray-400: #474642;  --gray-500: #5d5c58;  --gray-600: #97948e;  /* 5.39:1 on cards, for labels ≥12px */
  --gray-700: #adaba5;  /* 7.10:1 secondary text */  --gray-800: #cbc8c2;  /* 9.76:1 */
  --gray-900: #e8e5e0;  /* 12.97:1 primary text — warm off-white, never #fff, which haloes on dark */
  --white: #ffffff;     /* kept for completeness; nothing references it on dark — pure white is
                           never a surface or a text colour here, --gray-900 is the top of the ramp */

  /* ---- Brand primary: ink blue, lifted and de-saturated for a dark ground -------
     The light build's #12719e is far too dark to sit on graphite, so the ramp inverts:
     50 is now the faintest blue-tinted *surface* and 900 the brightest accent. Chroma is
     pulled back from the light build so the accent reads as steel/ink rather than neon —
     saturated blues vibrate against dark neutrals. Fills at 700+ take dark ink on top. */
  --brand-50:  #1b2429;  --brand-100: #223037;  --brand-200: #2e4450;
  --brand-300: #3d5c6c;  --brand-400: #4e7d94;  --brand-500: #5e97b1;
  --brand-600: #74acc6;  /* focus ring, gauges, hover borders, chart series 1 (6.56:1 on cards) */
  --brand-700: #8cbdd3;  /* primary button fill (dark ink on top, 8.83:1) + link/brand text (8.02:1) */
  --brand-800: #a5cee0;  /* hover on a primary fill, active nav text (9.70:1) */
  --brand-900: #c0e0ed;  /* pressed — on dark, "pressed" brightens rather than darkens */

  /* ---- Semantic colors: bg / border / text per hue + solid (fills) -----------
     Backgrounds are hue-tinted graphite (ΔE 1.9–2.9 off a card: present, never a block of
     color); text sits 6.5–8.3:1 on its own background; solids stay bright enough to carry
     dark ink (dan-solid 4.98:1) and to read as dots/fills against a card. */
  --pos-bg: #16241c;  --pos-border: #2c4636;  --pos-text: #7fc99a;  --pos-solid: #4faa72;
  --wrn-bg: #262017;  --wrn-border: #4a3c22;  --wrn-text: #d9b26a;  --wrn-solid: #c99a3d;
  --dan-bg: #2a1c1a;  --dan-border: #573530;  --dan-text: #e39a92;  --dan-solid: #d0685e;
  --inf-bg: #1b2429;  --inf-border: #2e4450;  --inf-text: #8cbdd3;  --inf-solid: #5e97b1;
  --neu-bg: #272725;  --neu-border: #3f3e3a;  --neu-text: #adaba5;  --neu-solid: #6f6d68;
  --acc-bg: #1b2429;  --acc-border: #2e4450;  --acc-text: #8cbdd3;  --acc-solid: #8cbdd3;

  /* ---- Categorical chart palette, 6 colors (fixed order, never cycled) -------
     Re-lifted for a dark plot ground and re-validated locally (OKLab ΔE, Machado 2009
     CVD at severity 1.0): adjacent pairs worst-case 15.5 normal vision (threshold ≥15)
     and 12.7 under protan / 13.2 under deutan (threshold ≥8); all 6 are ≥5.2:1 against
     a card, comfortably past the 3:1 non-text floor.
     For scatter / bubble / map charts — shapes where any two colors may end up adjacent
     — the series limit is the first 3 slots (all-pairs CVD holds at 11.7 protan /
     8.3 deutan there, and collapses to 2.2 once slots 4–6 are in play). */
  --cat-1: #6fa8c9;  /* ink blue (brand) */
  --cat-2: #d1a544;  /* ochre gold */
  --cat-3: #db6f92;  /* rose red */
  --cat-4: #9d8ce6;  /* purple */
  --cat-5: #9ab456;  /* olive green */
  --cat-6: #c479b8;  /* plum purple */

  /* ---- Dedicated pairing for treatment vs. holdout control group -------------
     Treatment = solid line in the brand color; holdout = dashed neutral gray (chroma
     0.008 vs the accent's 0.070 — below the identification threshold, so it inherently
     reads as "the control"), and the two sit ΔE 11.4 apart. */
  --series-treat: var(--brand-600);   --series-treat-fill: rgba(116, 172, 198, 0.14);
  --series-hold: #97948e;             --series-hold-fill: rgba(151, 148, 142, 0.10);
  --series-treat-dash: none;          --series-hold-dash: 5 4;

  /* ---- Sequential ramp (heatmaps / one measure, dark to light) ---------------
     Direction flips with the theme: on a dark ground "more" has to mean brighter, so
     seq-1 is the faintest tint and seq-6 the brightest. Steps are ΔE 8.3–11.0 apart. */
  --seq-1: #22313a; --seq-2: #2d4855; --seq-3: #3c6174;
  --seq-4: #4d7f97; --seq-5: #65a0bb; --seq-6: #8cc2da;

  /* ---- Semantic layer: surfaces / text / borders -----------------------------
     The elevation ladder, darkest → lightest, with every adjacent pair kept perceptible:
     page #191918 → card #202020 → hover #292927 → recessed #2d2d2b → deep #343432.
     Monospace blocks go the other way (darker than a card) so they read as inset. */
  --surface-page: #191918;      /* page background — the floor */
  --surface-1: var(--gray-100); /* cards */
  --surface-2: var(--gray-200); /* recessed areas, table headers */
  --surface-3: #343432;         /* deeper recess */
  --surface-hover: #292927;  --surface-active: var(--brand-50);
  --surface-mono: #1c1c1b;   /* background for monospace blocks — inset, below the card */

  --text-1: var(--gray-900);  --text-2: var(--gray-700);  --text-3: var(--gray-600);
  --text-inverse: #171716;       /* dark ink for the light brand/danger fills */
  --text-brand: var(--brand-700);
  --text-pos: var(--pos-text);   --text-neg: var(--dan-text);

  --border-1: var(--gray-300);   /* default hairline; the only default border color site-wide */
  --border-2: var(--gray-400);   /* emphasized borders, table separators */
  --border-focus: var(--brand-600);  --divider: #302f2d;

  /* ---- Spacing (4px base unit, 8 steps) ----------------------------------- */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 48px;

  /* ---- Corner radii (4 steps, deliberately restrained) -------------------- */
  --r-1: 3px; --r-2: 5px; --r-3: 8px; --r-full: 999px;

  /* ---- Shadows (3 steps, max blur 10px; no large-area drop shadows) ----------
     Shadows are near-black now (tinting them with the old blue ink just muddied the
     graphite), and 2/3 add a 1px inset top highlight. That highlight is the whole trick
     for depth on a dark ground: it catches the top edge of a card the way a real
     surface catches light, which is what the drop shadow can no longer do down here. */
  --sh-1: 0 1px 1px rgba(0, 0, 0, 0.30);
  --sh-2: 0 1px 2px rgba(0, 0, 0, 0.36), 0 2px 5px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.035);
  --sh-3: 0 1px 3px rgba(0, 0, 0, 0.42), 0 4px 10px rgba(0, 0, 0, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
  --ring: 0 0 0 3px rgba(116, 172, 198, 0.30);

  /* ---- Typefaces ---------------------------------------------------------- */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
               "Liberation Mono", monospace;

  /* ---- Type scale, 7 steps (including the display size for big financial numbers) - */
  --fs-xs: 11px;  --fs-sm: 12px;  --fs-md: 14px;  /* body */
  --fs-lg: 16px;  --fs-xl: 20px;  --fs-2xl: 26px;
  --fs-display: clamp(30px, 1.5rem + 1.1vw, 38px);   /* big financial numbers */

  /* ---- Font weights / line heights ---------------------------------------- */
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --lh-tight: 1.2; --lh-snug: 1.4; --lh-normal: 1.6; --lh-loose: 1.75;
  --tracking-caps: 0.06em;

  /* ---- z-index layers ----------------------------------------------------- */
  --z-base: 0; --z-raised: 10; --z-sticky: 100; --z-sidebar: 200; --z-dropdown: 300;
  --z-tooltip: 400; --z-overlay: 500; --z-modal: 510; --z-toast: 600;

  /* ---- Transitions -------------------------------------------------------- */
  --dur-fast: 110ms; --dur-base: 170ms; --dur-slow: 240ms; --ease: cubic-bezier(0.2, 0.6, 0.3, 1);

  /* ---- Layout dimensions -------------------------------------------------- */
  --sidebar-w: 244px;  --sidebar-w-rail: 68px;
  --topbar-h: 56px;    --page-max: 1440px;
}

/* ==========================================================================
   3. BASE
   ========================================================================== */
body {
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: var(--lh-normal);
  color: var(--text-1);
  background: var(--surface-page);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;          /* body never scrolls horizontally */
}
h1, h2, h3, h4 { line-height: var(--lh-snug); font-weight: var(--fw-semibold); }
h1 { font-size: var(--fs-2xl); letter-spacing: -0.01em; }
h2 { font-size: var(--fs-xl); letter-spacing: -0.01em; }
h3 { font-size: var(--fs-lg); }
h4 { font-size: var(--fs-md); }
p { color: var(--text-2); }
small { font-size: var(--fs-sm); }
strong { font-weight: var(--fw-semibold); color: var(--text-1); }
code, kbd, pre, .mono { font-family: var(--font-mono); font-size: 0.92em; font-variant-ligatures: none; }
hr { border: 0; border-top: 1px solid var(--divider); margin: var(--sp-5) 0; }
::selection { background: var(--brand-100); color: var(--brand-900); }

/* Global keyboard focus: explicit, never merely implied by a shadow */
:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; border-radius: var(--r-1); }
:focus:not(:focus-visible) { outline: none; }

/* Financial figures: apply tabular-nums everywhere that needs vertical alignment */
.num, .u-num, .kpi__value, .table td.num, .table th.num, .tick-label,
.ab__value, .authz__uses, .progress__labels, .memo__conf-val {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* ==========================================================================
   4. LAYOUT — APP SHELL
   ========================================================================== */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }

/* ---- Sidebar ------------------------------------------------------------ */
.sidebar {
  position: sticky;
  top: 0;
  z-index: var(--z-sidebar);
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-1);
  border-right: 1px solid var(--border-1);
}
.sidebar__brand { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-4) var(--sp-4) var(--sp-3); }
.brand__mark {
  width: 26px; height: 26px; flex: none;
  border-radius: var(--r-2);
  background: var(--brand-700);
  color: var(--text-inverse);
  display: grid; place-items: center;
  font-size: var(--fs-sm); font-weight: var(--fw-bold);
  letter-spacing: 0;
}
.brand__name { font-size: var(--fs-md); font-weight: var(--fw-semibold); letter-spacing: -0.01em; }
.brand__sub { font-size: var(--fs-xs); color: var(--text-3); }

.sidebar__shop {
  display: flex; align-items: center; gap: var(--sp-2);
  width: calc(100% - var(--sp-6));
  margin: 0 var(--sp-3) var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border-1);
  border-radius: var(--r-2);
  background: var(--surface-1);
  text-align: left;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.sidebar__shop:hover { background: var(--surface-hover); border-color: var(--border-2); }
.sidebar__shop-avatar {
  width: 22px; height: 22px; flex: none; border-radius: var(--r-1);
  background: var(--gray-200); color: var(--text-2);
  display: grid; place-items: center; font-size: var(--fs-xs); font-weight: var(--fw-semibold);
}
.sidebar__shop-name { flex: 1; min-width: 0; font-size: var(--fs-sm); font-weight: var(--fw-medium);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar__shop-caret { color: var(--text-3); font-size: var(--fs-xs); }

.sidebar__nav { flex: 1; overflow-y: auto; padding: var(--sp-1) var(--sp-3) var(--sp-4); }
.nav__group + .nav__group { margin-top: var(--sp-5); }
.nav__label {
  padding: 0 var(--sp-2) var(--sp-2);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-3);
}
.nav__item {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 7px var(--sp-2);
  border-radius: var(--r-2);
  font-size: var(--fs-md); color: var(--text-2);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.nav__item:hover { background: var(--surface-hover); color: var(--text-1); }
.nav__item.is-active {
  background: var(--surface-active);
  color: var(--brand-800);
  font-weight: var(--fw-semibold);
  box-shadow: inset 2px 0 0 var(--brand-700);
}
.nav__icon { width: 16px; height: 16px; flex: none; opacity: 0.85; }
.nav__text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav__badge {
  flex: none; min-width: 18px; padding: 0 5px;
  border-radius: var(--r-full);
  background: var(--dan-solid); color: var(--text-inverse);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); text-align: center;
  line-height: 18px;
}
.nav__badge--quiet { background: var(--gray-200); color: var(--text-2); }

.sidebar__foot { padding: var(--sp-3) var(--sp-4) var(--sp-4); border-top: 1px solid var(--divider); }
.usage__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); }
.usage__label { font-size: var(--fs-xs); color: var(--text-3); font-weight: var(--fw-medium); }
.usage__num { font-size: var(--fs-sm); font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; }
.usage__note { margin-top: var(--sp-1); font-size: var(--fs-xs); color: var(--text-3); line-height: var(--lh-snug); }

/* ---- Main content area -------------------------------------------------- */
.app__main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: var(--z-sticky);
  display: flex; align-items: center; gap: var(--sp-4);
  min-height: var(--topbar-h);
  padding: var(--sp-2) var(--sp-6);
  background: rgba(25, 25, 24, 0.86);   /* --surface-page at alpha, so content dims under it */
  backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--border-1);
}
.topbar__left { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.topbar__title { font-size: var(--fs-md); font-weight: var(--fw-semibold); white-space: nowrap; }
.topbar__right { display: flex; align-items: center; gap: var(--sp-3); margin-left: auto; }
.topbar__sep { width: 1px; height: 20px; background: var(--divider); flex: none; }

.main { flex: 1; padding: var(--sp-6); }
.page { max-width: var(--page-max); margin: 0 auto; }
.stack > * + * { margin-top: var(--sp-6); }
.stack--tight > * + * { margin-top: var(--sp-4); }

/* Card: the only container style site-wide */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  border-radius: var(--r-3);
  box-shadow: var(--sh-1);
}
.card__body { padding: var(--sp-5); }
.card__head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--divider);
}
.card__title { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
.card__foot {
  padding: var(--sp-3) var(--sp-5);
  border-top: 1px solid var(--divider);
  background: var(--surface-2);
  border-radius: 0 0 var(--r-3) var(--r-3);
  font-size: var(--fs-sm); color: var(--text-2);
}
.card--flush .card__body { padding: 0; }

/* ==========================================================================
   5. COMPONENTS
   ========================================================================== */

/* ---- 5.1 Period picker / segmented control ------------------------------ */
.segmented { display: inline-flex; padding: 2px; background: var(--surface-3); border-radius: var(--r-2); }
.segmented__item {
  padding: 4px var(--sp-3); border-radius: var(--r-1);
  font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-2);
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.segmented__item:hover { color: var(--text-1); }
.segmented__item.is-active {
  background: var(--surface-1); color: var(--text-1);
  font-weight: var(--fw-semibold); box-shadow: var(--sh-1);
}

/* ---- 5.2 Status indicator light ----------------------------------------- */
.status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-2); }
.status__dot {
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--neu-solid);
  box-shadow: 0 0 0 3px var(--neu-bg);
}
.status--ok    .status__dot { background: var(--pos-solid); box-shadow: 0 0 0 3px var(--pos-bg); }
.status--warn  .status__dot { background: var(--wrn-solid); box-shadow: 0 0 0 3px var(--wrn-bg); }
.status--error .status__dot { background: var(--dan-solid); box-shadow: 0 0 0 3px var(--dan-bg); }
.status--off   .status__dot { background: var(--gray-500); box-shadow: 0 0 0 3px var(--gray-200); }
.status--ok.status--live .status__dot { animation: pulse 2.4s var(--ease) infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px var(--pos-bg); }
  50%      { box-shadow: 0 0 0 5px rgba(79, 170, 114, 0.18); }
}

/* Top-bar spend cap (compact progress) */
.capbar { display: flex; align-items: center; gap: var(--sp-2); min-width: 168px; }
.capbar__text { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }
.capbar__num { font-size: var(--fs-sm); font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; }

/* ---- 5.3 Tab navigation ------------------------------------------------- */
.tabs { border-bottom: 1px solid var(--border-1); }
.tabs__list { display: flex; gap: var(--sp-5); overflow-x: auto; scrollbar-width: none; }
.tabs__list::-webkit-scrollbar { display: none; }
.tab {
  position: relative;
  padding: var(--sp-3) 0;
  font-size: var(--fs-md); font-weight: var(--fw-medium); color: var(--text-2);
  white-space: nowrap;
  transition: color var(--dur-fast) var(--ease);
}
.tab:hover { color: var(--text-1); }
.tab::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: transparent; border-radius: 1px;
}
.tab.is-active { color: var(--brand-800); font-weight: var(--fw-semibold); }
.tab.is-active::after { background: var(--brand-700); }
.tab__count {
  margin-left: 6px; padding: 0 5px; border-radius: var(--r-full);
  background: var(--gray-200); color: var(--text-2);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
}
.tab.is-active .tab__count { background: var(--brand-100); color: var(--brand-800); }
.tabs--inset { padding: 0 var(--sp-5); background: var(--surface-1); border-radius: var(--r-3) var(--r-3) 0 0; }

/* ---- 5.4 Section header ------------------------------------------------- */
.section__head { display: flex; align-items: flex-end; gap: var(--sp-4); margin-bottom: var(--sp-4); }
.section__heading { min-width: 0; }
.section__title {
  font-size: var(--fs-xl); font-weight: var(--fw-semibold);
  letter-spacing: -0.01em; line-height: var(--lh-tight);
}
.section__sub {
  margin-top: 5px;
  font-size: var(--fs-sm); color: var(--text-2); line-height: var(--lh-snug);
  max-width: 66ch;
}
.section__actions { margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); flex: none; }
.section--divided { padding-top: var(--sp-6); border-top: 1px solid var(--divider); }

/* ---- 5.5 KPI cards ------------------------------------------------------ */
.kpi-grid { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fit, minmax(216px, 1fr)); }
.kpi {
  display: flex; flex-direction: column;
  padding: var(--sp-4) var(--sp-5) var(--sp-4);
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  border-radius: var(--r-3);
  box-shadow: var(--sh-1);
}
.kpi__label {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-2);
}
.kpi__row { display: flex; align-items: baseline; gap: var(--sp-2); margin-top: var(--sp-2); flex-wrap: wrap; }
.kpi__value {
  font-size: var(--fs-2xl); font-weight: var(--fw-semibold);
  line-height: 1.1; letter-spacing: -0.02em; color: var(--text-1);
}
.kpi__prefix { font-size: 0.62em; font-weight: var(--fw-medium); color: var(--text-2); margin-right: 1px; }
.kpi__unit { font-size: var(--fs-sm); color: var(--text-2); font-weight: var(--fw-medium); }
.kpi--hero .kpi__value { font-size: var(--fs-display); }
.kpi--hero { border-color: var(--brand-200); background: linear-gradient(var(--brand-50), var(--surface-1) 56%); }

.kpi__delta {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1px 6px 1px 4px; border-radius: var(--r-1);
  font-size: var(--fs-sm); font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
  background: var(--neu-bg); color: var(--neu-text);
}
.kpi__delta::before { font-size: 9px; line-height: 1; }
.kpi__delta--up   { background: var(--pos-bg); color: var(--pos-text); }
.kpi__delta--up::before { content: "\25B2"; }
.kpi__delta--down { background: var(--dan-bg); color: var(--dan-text); }
.kpi__delta--down::before { content: "\25BC"; }
.kpi__delta--flat::before { content: "\2013"; font-size: var(--fs-sm); }
/* Inverted semantics: add .kpi--inverse for metrics where a decrease is good, such as cost or return rate */
.kpi--inverse .kpi__delta--up   { background: var(--dan-bg); color: var(--dan-text); }
.kpi--inverse .kpi__delta--down { background: var(--pos-bg); color: var(--pos-text); }

.kpi__basis {
  margin-top: var(--sp-3); padding-top: var(--sp-2);
  border-top: 1px dashed var(--border-1);
  font-size: var(--fs-sm); color: var(--text-2); line-height: var(--lh-snug);
}
.kpi__basis .num { font-weight: var(--fw-semibold); color: var(--text-1); }
.kpi__audit {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 6px;
  font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--brand-700);
  border-bottom: 1px solid var(--brand-200);
  width: fit-content;
  transition: border-color var(--dur-fast) var(--ease);
}
.kpi__audit:hover { border-color: var(--brand-600); }
.kpi__audit::after { content: "\2197"; font-size: 10px; }
.kpi:has(.kpi__audit) .kpi__basis { padding-bottom: 0; }
.kpi__spark { margin-top: var(--sp-3); height: 34px; }

/* ---- 5.6 Data tables ---------------------------------------------------- */
.table-wrap {
  overflow-x: auto;
  overflow-y: visible;
  -webkit-overflow-scrolling: touch;
  border-radius: var(--r-3);
  border: 1px solid var(--border-1);
  background: var(--surface-1);
}
.table-wrap--tall { max-height: 520px; overflow-y: auto; }
.table { font-size: var(--fs-md); min-width: 720px; }
.table th, .table td { padding: 10px var(--sp-4); border-bottom: 1px solid var(--divider); vertical-align: middle; }
.table thead th {
  position: sticky; top: 0; z-index: var(--z-raised);
  background: var(--surface-2);
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-2);
  white-space: nowrap;
  border-bottom: 1px solid var(--border-2);
}
.table thead th.num, .table td.num { text-align: right; }
.table td.num { font-weight: var(--fw-medium); }
.table tbody tr:nth-child(even) { background: #242423; }  /* zebra striping — one step up from the card, not down */
.table--no-zebra tbody tr:nth-child(even) { background: transparent; }
.table tbody tr:hover { background: var(--surface-hover); }
.table tbody tr:last-child td { border-bottom: 0; }
.table__cell--key { font-weight: var(--fw-medium); color: var(--text-1); }
.table__cell--sticky { position: sticky; left: 0; z-index: 1; background: var(--surface-1); box-shadow: 1px 0 0 var(--divider); }
.table tbody tr:nth-child(even) .table__cell--sticky { background: #242423; }
.table tbody tr:hover .table__cell--sticky { background: var(--surface-hover); }
.table thead .table__cell--sticky { background: var(--surface-2); z-index: 12; }
.table--compact th, .table--compact td { padding: 7px var(--sp-3); font-size: var(--fs-sm); }

/* Expandable rows */
.table__toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: var(--r-1);
  color: var(--text-3);
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.table__toggle:hover { background: var(--surface-3); color: var(--text-1); }
.table__toggle::before { content: "\25B8"; font-size: 10px; }
.table__toggle[aria-expanded="true"] { transform: rotate(90deg); color: var(--text-1); }
.table tbody tr:has(> td > .table__toggle[aria-expanded="true"]) { background: var(--brand-50); }
.table__detail-row > td {
  padding: 0 var(--sp-4) var(--sp-4);
  background: var(--surface-mono);
  border-bottom: 1px solid var(--border-2);
}
.table__detail {
  padding: var(--sp-3);
  border: 1px solid var(--border-1); border-radius: var(--r-2);
  background: var(--surface-1);
  font-family: var(--font-mono); font-size: var(--fs-sm);
  line-height: var(--lh-loose); color: var(--text-2);
  white-space: pre-wrap; word-break: break-word;
}
.table__detail-label {
  display: block; margin-bottom: var(--sp-2);
  font-family: var(--font-sans); font-size: var(--fs-xs);
  font-weight: var(--fw-semibold); letter-spacing: var(--tracking-caps);
  text-transform: uppercase; color: var(--text-3);
}
.table__detail dt { color: var(--text-3); }
.table__detail dd { color: var(--text-1); margin: 0 0 var(--sp-2); }

/* Total row: double rule above (financial-statement feel) */
.table tfoot td, .table__total td {
  padding-top: var(--sp-3); padding-bottom: var(--sp-3);
  border-top: 3px double var(--border-2);
  border-bottom: 0;
  background: var(--surface-2);
  font-weight: var(--fw-semibold); color: var(--text-1);
}
.table tfoot tr:first-child td { box-shadow: none; }
.table__subtotal td {
  border-top: 1px solid var(--border-2);
  background: var(--surface-2); font-weight: var(--fw-medium);
}

/* ---- 5.7 Badge / Pill --------------------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 7px;
  border: 1px solid var(--neu-border); border-radius: var(--r-1);
  background: var(--neu-bg); color: var(--neu-text);
  font-size: var(--fs-sm); font-weight: var(--fw-medium);
  line-height: 18px; white-space: nowrap;
}
.badge--positive { background: var(--pos-bg); border-color: var(--pos-border); color: var(--pos-text); }
.badge--warning  { background: var(--wrn-bg); border-color: var(--wrn-border); color: var(--wrn-text); }
.badge--danger   { background: var(--dan-bg); border-color: var(--dan-border); color: var(--dan-text); }
.badge--info     { background: var(--inf-bg); border-color: var(--inf-border); color: var(--inf-text); }
.badge--neutral  { background: var(--neu-bg); border-color: var(--neu-border); color: var(--neu-text); }
.badge--accent   { background: var(--acc-bg); border-color: var(--acc-border); color: var(--acc-text); }
.badge--solid    { background: var(--brand-700); border-color: var(--brand-700); color: var(--text-inverse); }
.badge--pill     { border-radius: var(--r-full); padding: 1px 9px; }
.badge--quiet    { background: transparent; }
.badge__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

/* The 4 authorization levels: always icon + text; color alone never carries the meaning */
.lvl {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 8px;
  border: 1px solid var(--border-1); border-radius: var(--r-full);
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: 19px;
  white-space: nowrap;
}
.lvl::before { font-size: 10px; line-height: 1; }
.lvl--auto        { background: var(--pos-bg); border-color: var(--pos-border); color: var(--pos-text); }
.lvl--auto::before { content: "\25CF"; }
.lvl--conditional { background: var(--inf-bg); border-color: var(--inf-border); color: var(--inf-text); }
.lvl--conditional::before { content: "\25D0"; }
.lvl--approval    { background: var(--wrn-bg); border-color: var(--wrn-border); color: var(--wrn-text); }
.lvl--approval::before { content: "\25B3"; }
.lvl--disabled    { background: var(--gray-200); border-color: var(--border-2); color: var(--text-2); }
.lvl--disabled::before { content: "\2298"; }

/* The 3 risk levels */
.risk {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 0 7px; border-radius: var(--r-1);
  border: 1px solid transparent;
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: 19px;
}
.risk::before { content: ""; width: 6px; height: 6px; border-radius: 1px; background: currentColor; }
.risk--low    { background: var(--pos-bg); border-color: var(--pos-border); color: var(--pos-text); }
.risk--medium { background: var(--wrn-bg); border-color: var(--wrn-border); color: var(--wrn-text); }
.risk--high   { background: var(--dan-bg); border-color: var(--dan-border); color: var(--dan-text); }

/* ---- 5.8 Progress bars and gauges --------------------------------------- */
.progress {
  --at: 80%;              /* threshold position */
  --value: 0%;            /* current value */
  position: relative;
  height: 8px;
  background: var(--surface-3);
  border-radius: var(--r-full);
  overflow: visible;
}
.progress__fill {
  position: absolute; inset: 0 auto 0 0;
  width: var(--value);
  max-width: 100%;
  background: var(--brand-600);
  border-radius: var(--r-full);
  transition: width var(--dur-slow) var(--ease), background-color var(--dur-base) var(--ease);
}
.progress__fill.is-near  { background: var(--wrn-solid); }
.progress__fill.is-over  { background: var(--dan-solid); }
.progress__threshold {
  position: absolute; top: -3px; bottom: -3px; left: var(--at);
  width: 2px; margin-left: -1px;
  background: var(--gray-800);
  border-radius: 1px;
}
.progress__threshold::after {
  content: attr(data-label);
  position: absolute; top: calc(100% + 3px); left: 50%;
  transform: translateX(-50%);
  font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap;
}
.progress--lg { height: 12px; }
.progress--labelled { margin-bottom: var(--sp-5); }
.progress__labels {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2);
  margin-bottom: 6px;
  font-size: var(--fs-sm); color: var(--text-2);
}
.progress__labels strong { font-variant-numeric: tabular-nums; }

.meter { height: 4px; background: var(--surface-3); border-radius: var(--r-full); overflow: hidden; }
.meter__fill {
  --value: 0%;
  height: 100%; width: var(--value);
  background: var(--brand-600); border-radius: var(--r-full);
  transition: width var(--dur-slow) var(--ease);
}
.meter__fill.is-near { background: var(--wrn-solid); }
.meter__fill.is-over { background: var(--dan-solid); }

/* Circular confidence score */
.gauge {
  --value: 0;             /* 0–100 */
  --gauge-color: var(--brand-600);
  position: relative;
  width: 52px; height: 52px; flex: none;
  border-radius: 50%;
  background: conic-gradient(var(--gauge-color) calc(var(--value) * 1%), var(--gray-300) 0);
  display: grid; place-items: center;
}
.gauge::before { content: ""; position: absolute; inset: 5px; background: var(--surface-1); border-radius: 50%; }
.gauge__value {
  position: relative;
  font-size: var(--fs-sm); font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.gauge--sm { width: 36px; height: 36px; }
.gauge--sm::before { inset: 4px; }
.gauge--sm .gauge__value { font-size: var(--fs-xs); }
.gauge--high { --gauge-color: var(--pos-solid); }
.gauge--mid  { --gauge-color: var(--wrn-solid); }
.gauge--low  { --gauge-color: var(--dan-solid); }
.gauge-wrap { display: flex; align-items: center; gap: var(--sp-3); }
.gauge-wrap__label { font-size: var(--fs-sm); color: var(--text-2); line-height: var(--lh-snug); }

/* ---- 5.9 Timeline (audit trail) ----------------------------------------- */
.timeline { position: relative; padding-left: var(--sp-5); }
.timeline::before {
  content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px;
  width: 1px; background: var(--border-1);
}
.timeline__item { position: relative; padding-bottom: var(--sp-5); }
.timeline__item:last-child { padding-bottom: 0; }
.timeline__node {
  position: absolute; left: calc(var(--sp-5) * -1 + 1px); top: 4px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--surface-1);
  border: 2px solid var(--gray-500);
}
.timeline__node--ok    { border-color: var(--pos-solid); background: var(--pos-solid); }
.timeline__node--warn  { border-color: var(--wrn-solid); background: var(--wrn-solid); }
.timeline__node--error { border-color: var(--dan-solid); background: var(--dan-solid); }
.timeline__node--open  { border-color: var(--brand-600); }
.timeline__head { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
.timeline__time {
  font-size: var(--fs-sm); color: var(--text-3);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.timeline__title { font-size: var(--fs-md); font-weight: var(--fw-medium); color: var(--text-1); }
.timeline__text { margin-top: 2px; font-size: var(--fs-sm); color: var(--text-2); }
.timeline__hash {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 6px;
  padding: 1px 6px;
  background: var(--surface-mono); border: 1px solid var(--border-1); border-radius: var(--r-1);
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-3);
  word-break: break-all;
}
.timeline__hash::before { content: "\1F5DD"; font-family: var(--font-sans); opacity: 0.5; }
.timeline__more {
  margin-top: var(--sp-2);
  font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--brand-700);
}
.timeline__more::after { content: " \25BE"; font-size: 9px; }
.timeline__item:has(.timeline__more[aria-expanded="true"]) .timeline__more::after { content: " \25B4"; }
.timeline__detail {
  margin-top: var(--sp-2); padding: var(--sp-3);
  background: var(--surface-mono);
  border: 1px solid var(--border-1); border-radius: var(--r-2);
  font-family: var(--font-mono); font-size: var(--fs-sm); line-height: var(--lh-loose);
  color: var(--text-2); white-space: pre-wrap; word-break: break-word;
}
.timeline--dense .timeline__item { padding-bottom: var(--sp-3); }

/* ---- 5.10 Pending-approval queue card ----------------------------------- */
.approval {
  --risk-color: var(--gray-500);
  position: relative;
  padding: var(--sp-4) var(--sp-5) var(--sp-4) calc(var(--sp-5) + 3px);
  background: var(--surface-1);
  border: 1px solid var(--border-1); border-radius: var(--r-3);
  box-shadow: var(--sh-1);
}
.approval::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--risk-color);
  border-radius: var(--r-3) 0 0 var(--r-3);
}
.approval:has(.risk--high)   { --risk-color: var(--dan-solid); }
.approval:has(.risk--medium) { --risk-color: var(--wrn-solid); }
.approval:has(.risk--low)    { --risk-color: var(--pos-solid); }
.approval__head { display: flex; align-items: flex-start; gap: var(--sp-3); }
.approval__title { font-size: var(--fs-lg); font-weight: var(--fw-semibold); line-height: var(--lh-snug); }
.approval__meta {
  margin-top: 3px; display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
  font-size: var(--fs-sm); color: var(--text-3);
}
.approval__badges { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }

/* Rule comparison: your rule vs. what is being requested this time */
.rulecmp {
  display: grid; gap: 1px;
  grid-template-columns: 1fr 28px 1fr;
  margin-top: var(--sp-4);
  background: var(--border-1);
  border: 1px solid var(--border-1); border-radius: var(--r-2);
  overflow: hidden;
}
.rulecmp__col { background: var(--surface-2); padding: var(--sp-3); }
.rulecmp__col--ask { background: var(--wrn-bg); }
.rulecmp__label {
  font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-3);
}
.rulecmp__col--ask .rulecmp__label { color: var(--wrn-text); }
.rulecmp__val {
  margin-top: 4px; font-size: var(--fs-md); font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums; color: var(--text-1);
}
.rulecmp__note { margin-top: 2px; font-size: var(--fs-sm); color: var(--text-2); }
.rulecmp__arrow {
  display: grid; place-items: center;
  background: var(--surface-1); color: var(--text-3); font-size: var(--fs-sm);
}
.rulecmp__arrow::before { content: "\2192"; }
.rulecmp--stack { grid-template-columns: 1fr; }
.rulecmp--stack .rulecmp__arrow { height: 20px; }
.rulecmp--stack .rulecmp__arrow::before { content: "\2193"; }

.approval__facts { display: flex; flex-wrap: wrap; gap: var(--sp-5); margin-top: var(--sp-4); }
.approval__fact { min-width: 96px; }
.approval__fact-label { font-size: var(--fs-xs); color: var(--text-3); }
.approval__fact-value {
  font-size: var(--fs-lg); font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
}
.approval__fact-value--pos { color: var(--pos-text); }
.approval__fact-value--neg { color: var(--dan-text); }
.approval__sla {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 7px; border-radius: var(--r-1);
  background: var(--neu-bg); border: 1px solid var(--neu-border);
  font-size: var(--fs-sm); font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums; color: var(--neu-text);
}
.approval__sla::before { content: "\23F1"; font-size: 10px; }
.approval__sla.is-urgent { background: var(--dan-bg); border-color: var(--dan-border); color: var(--dan-text); }
.approval__foot {
  display: flex; align-items: center; gap: var(--sp-2);
  margin-top: var(--sp-4); padding-top: var(--sp-3);
  border-top: 1px solid var(--divider);
  flex-wrap: wrap;
}
.approval__foot .u-spacer { flex: 1; }

/* ---- 5.11 Buttons ------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px var(--sp-4);
  min-height: 34px;
  border: 1px solid transparent; border-radius: var(--r-2);
  font-size: var(--fs-md); font-weight: var(--fw-medium);
  line-height: 1.2; white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease),
              border-color var(--dur-fast) var(--ease),
              color var(--dur-fast) var(--ease),
              box-shadow var(--dur-fast) var(--ease);
}
.btn__icon { width: 14px; height: 14px; flex: none; }
.btn--primary {
  background: var(--brand-700); border-color: var(--brand-800); color: var(--text-inverse);
  font-weight: var(--fw-semibold); box-shadow: var(--sh-1);
}
.btn--primary:hover { background: var(--brand-800); }
.btn--primary:active { background: var(--brand-900); box-shadow: none; }
.btn--secondary {
  background: var(--surface-1); border-color: var(--border-2); color: var(--text-1);
  box-shadow: var(--sh-1);
}
.btn--secondary:hover { background: var(--surface-hover); border-color: var(--gray-500); }
.btn--secondary:active { background: var(--surface-3); box-shadow: none; }
.btn--ghost { background: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface-3); color: var(--text-1); }
.btn--danger {
  background: var(--surface-1); border-color: var(--dan-border); color: var(--dan-text);
}
.btn--danger:hover { background: var(--dan-bg); border-color: var(--dan-solid); }
.btn--danger-solid {
  background: var(--dan-solid); border-color: var(--dan-solid); color: var(--text-inverse);
  font-weight: var(--fw-semibold);
}
.btn--danger-solid:hover { filter: brightness(0.93); }
.btn--sm { padding: 3px var(--sp-3); min-height: 26px; font-size: var(--fs-sm); }
.btn--lg { padding: 10px var(--sp-5); min-height: 42px; font-size: var(--fs-lg); }
.btn--block { width: 100%; }
.btn:disabled, .btn[aria-disabled="true"] {
  cursor: not-allowed; opacity: 0.5; box-shadow: none;
  filter: none; pointer-events: none;
}
.btn-group { display: inline-flex; }
.btn-group .btn { border-radius: 0; margin-left: -1px; }
.btn-group .btn:first-child { border-radius: var(--r-2) 0 0 var(--r-2); margin-left: 0; }
.btn-group .btn:last-child { border-radius: 0 var(--r-2) var(--r-2) 0; }
.link {
  color: var(--brand-700); font-weight: var(--fw-medium);
  border-bottom: 1px solid var(--brand-200);
  transition: border-color var(--dur-fast) var(--ease);
}
.link:hover { border-color: var(--brand-600); }

/* ---- 5.12 Form controls ------------------------------------------------- */
.field { display: block; }
.field + .field { margin-top: var(--sp-4); }
.field__label {
  display: block; margin-bottom: 5px;
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-1);
}
.field__hint { margin-top: 5px; font-size: var(--fs-sm); color: var(--text-3); line-height: var(--lh-snug); }
.field__error { margin-top: 5px; font-size: var(--fs-sm); color: var(--dan-text); }
.field:has(input:disabled) .field__label, .field:has(select:disabled) .field__label { color: var(--text-3); }

.input, .select, .textarea {
  width: 100%;
  padding: 6px var(--sp-3);
  min-height: 34px;
  background: var(--surface-1);
  border: 1px solid var(--border-2); border-radius: var(--r-2);
  font-size: var(--fs-md); color: var(--text-1);
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.input::placeholder, .textarea::placeholder { color: var(--text-3); }
.input:hover, .select:hover { border-color: var(--gray-500); }
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--border-focus); box-shadow: var(--ring);
}
.input:disabled, .select:disabled { background: var(--surface-2); color: var(--text-3); cursor: not-allowed; }
.input[aria-invalid="true"] { border-color: var(--dan-solid); }
.textarea { min-height: 76px; resize: vertical; line-height: var(--lh-normal); }

.select {
  appearance: none;
  padding-right: var(--sp-7);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--text-3) 50%),
    linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 15px) 15px, calc(100% - 11px) 15px;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}

/* Inputs with a prefix/suffix (NT$, %, times) */
.input-affix {
  display: flex; align-items: stretch;
  border: 1px solid var(--border-2); border-radius: var(--r-2);
  background: var(--surface-1);
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.input-affix:hover { border-color: var(--gray-500); }
.input-affix:focus-within { border-color: var(--border-focus); box-shadow: var(--ring); }
.input-affix__prefix, .input-affix__suffix {
  display: grid; place-items: center;
  padding: 0 var(--sp-3);
  background: var(--surface-2); color: var(--text-2);
  font-size: var(--fs-sm); font-weight: var(--fw-medium);
  white-space: nowrap;
}
.input-affix__prefix { border-right: 1px solid var(--border-1); border-radius: var(--r-2) 0 0 var(--r-2); }
.input-affix__suffix { border-left: 1px solid var(--border-1); border-radius: 0 var(--r-2) var(--r-2) 0; }
.input-affix .input {
  border: 0; border-radius: 0; box-shadow: none; background: transparent;
}
.input-affix .input:focus { box-shadow: none; }
.input--num {
  text-align: right; font-variant-numeric: tabular-nums; font-weight: var(--fw-medium);
  appearance: textfield;
}
.input--num::-webkit-outer-spin-button, .input--num::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}

/* Search box */
.search { position: relative; }
.search .input { padding-left: var(--sp-7); }
.search::before {
  content: ""; position: absolute; left: 11px; top: 50%;
  width: 11px; height: 11px; margin-top: -7px;
  border: 1.5px solid var(--text-3); border-radius: 50%;
  pointer-events: none;
}
.search::after {
  content: ""; position: absolute; left: 19px; top: 50%;
  width: 5px; height: 1.5px; margin-top: 3px;
  background: var(--text-3); transform: rotate(45deg);
  pointer-events: none;
}

/* Range slider (with value label) */
.range { display: block; }
.range__head {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2);
  margin-bottom: 6px;
}
.range__label { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-2); }
.range__value {
  padding: 1px 7px; border-radius: var(--r-1);
  background: var(--surface-3); color: var(--text-1);
  font-size: var(--fs-sm); font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
}
.range__input {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 18px; background: transparent; cursor: pointer;
}
.range__input::-webkit-slider-runnable-track {
  height: 4px; border-radius: var(--r-full); background: var(--surface-3);
}
.range__input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; margin-top: -6px;
  border-radius: 50%; background: var(--surface-1);
  border: 1px solid var(--gray-500);
  box-shadow: var(--sh-2);
  transition: border-color var(--dur-fast) var(--ease);
}
.range__input:hover::-webkit-slider-thumb { border-color: var(--brand-600); }
.range__input:focus-visible::-webkit-slider-thumb { border-color: var(--brand-600); box-shadow: var(--ring); }
.range__input::-moz-range-track { height: 4px; border-radius: var(--r-full); background: var(--surface-3); }
.range__input::-moz-range-progress { height: 4px; border-radius: var(--r-full); background: var(--brand-600); }
.range__input::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--surface-1); border: 1px solid var(--gray-500); box-shadow: var(--sh-2);
}
.range__input:disabled { cursor: not-allowed; opacity: 0.5; }
.range__scale {
  display: flex; justify-content: space-between;
  margin-top: 2px; font-size: var(--fs-xs); color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

/* Toggle switch */
.switch { display: inline-flex; align-items: center; gap: var(--sp-2); cursor: pointer; }
.switch__input {
  -webkit-appearance: none; appearance: none;
  position: relative; flex: none;
  width: 34px; height: 20px; border-radius: var(--r-full);
  background: var(--gray-400);
  transition: background-color var(--dur-base) var(--ease);
  cursor: pointer;
}
.switch__input::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--gray-900); box-shadow: var(--sh-1);   /* off-white, not #fff — 7.5:1 on the track */
  transition: transform var(--dur-base) var(--ease);
}
.switch__input:checked { background: var(--brand-700); }
.switch__input:checked::after { transform: translateX(14px); }
.switch__input:disabled { opacity: 0.45; cursor: not-allowed; }
.switch__text { font-size: var(--fs-md); color: var(--text-1); }
.switch__text small { display: block; color: var(--text-3); }

.field-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.field-row > .field { flex: 1 1 180px; margin-top: 0; }

/* ---- 5.13 Authorization matrix ------------------------------------------ */
.authz { border: 1px solid var(--border-1); border-radius: var(--r-3); background: var(--surface-1); overflow: hidden; }
.authz__scroll { overflow-x: auto; }
.authz__head, .authz__row {
  display: grid;
  grid-template-columns: minmax(240px, 2.2fr) 140px minmax(190px, 1.4fr) 92px;
  gap: var(--sp-4);
  align-items: center;
  min-width: 760px;
  padding: var(--sp-3) var(--sp-5);
}
.authz__head {
  background: var(--surface-2);
  border-bottom: 1px solid var(--border-2);
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-2);
}
.authz__row { border-bottom: 1px solid var(--divider); }
.authz__row:last-child { border-bottom: 0; }
.authz__row:hover { background: var(--surface-hover); }
.authz__row:has(.lvl--disabled) { background: var(--surface-2); color: var(--text-3); }
.authz__row:has(.lvl--disabled) .authz__name { color: var(--text-2); }
.authz__tool { min-width: 0; }
.authz__name {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--fs-md); font-weight: var(--fw-semibold); color: var(--text-1);
}
.authz__desc { margin-top: 2px; font-size: var(--fs-sm); color: var(--text-2); line-height: var(--lh-snug); }
.authz__level { display: flex; }
.authz__threshold { min-width: 0; }
.authz__uses { text-align: right; font-size: var(--fs-sm); color: var(--text-2); }
.authz__uses strong { display: block; font-size: var(--fs-lg); font-weight: var(--fw-semibold); color: var(--text-1); }
.authz__group-title {
  padding: var(--sp-2) var(--sp-5);
  background: var(--surface-2); border-bottom: 1px solid var(--divider);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-3);
}

/* ---- 5.14 Memory cards -------------------------------------------------- */
.memo {
  padding: var(--sp-4);
  background: var(--surface-1);
  border: 1px solid var(--border-1); border-radius: var(--r-3);
  box-shadow: var(--sh-1);
}
.memo__body { font-size: var(--fs-md); color: var(--text-1); line-height: var(--lh-normal); }
.memo__srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--sp-3); }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px;
  background: var(--surface-2); border: 1px solid var(--border-1); border-radius: var(--r-full);
  font-size: var(--fs-sm); color: var(--text-2); line-height: 19px;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.chip--link { color: var(--brand-700); border-color: var(--brand-200); background: var(--brand-50); }
.chip--link:hover { background: var(--brand-100); border-color: var(--brand-300); }
.chip--link::after { content: "\2197"; font-size: 9px; }
.chip--mono { font-family: var(--font-mono); font-size: var(--fs-xs); }
.memo__foot {
  display: flex; align-items: center; gap: var(--sp-3);
  margin-top: var(--sp-3); padding-top: var(--sp-3);
  border-top: 1px solid var(--divider);
  flex-wrap: wrap;
}
.memo__conf { display: flex; align-items: center; gap: var(--sp-2); }
.memo__conf-label { font-size: var(--fs-xs); color: var(--text-3); }
.memo__conf-val { font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
/* Two lines of provenance, split by a <br>. It cannot be nowrap: the second line
   carries the verification method, which runs long enough to overflow the memo's
   grid column — and body clips overflow, so the tail was being cut off, not scrolled. */
.memo__verified { margin-left: auto; min-width: 0; font-size: var(--fs-sm); color: var(--text-3); }
.memo__verified.is-stale { color: var(--wrn-text); }
.memo--stale { border-color: var(--wrn-border); background: linear-gradient(var(--wrn-bg), var(--surface-1) 40%); }
.memo-grid { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

/* ---- 5.15 Chart container ----------------------------------------------- */
.chart {
  background: var(--surface-1);
  border: 1px solid var(--border-1); border-radius: var(--r-3);
  box-shadow: var(--sh-1);
  padding: var(--sp-4) var(--sp-5) var(--sp-5);
}
/* Wraps so the legend block can drop below the title instead of being pushed off
   the right edge on a phone. */
.chart__head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--sp-4); margin-bottom: var(--sp-4); }
.chart__title { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
.chart__sub { margin-top: 2px; font-size: var(--fs-sm); color: var(--text-2); }
.chart__tools { margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); flex: none; }
.chart__legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-bottom: var(--sp-3); }
.legend__item { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-2); }
.legend__swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; background: var(--cat-1); }
.legend__swatch--line { height: 3px; border-radius: 2px; width: 16px; }
.legend__swatch--dash {
  height: 0; width: 16px; border-radius: 0;
  border-top: 2px dashed var(--series-hold); background: none;
}
.legend__item--muted { color: var(--text-3); }
.legend__value { margin-left: 2px; font-weight: var(--fw-semibold); color: var(--text-1); font-variant-numeric: tabular-nums; }
.chart__plot { position: relative; }
.chart__svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart__axis-title {
  font-size: var(--fs-xs); color: var(--text-3);
  letter-spacing: var(--tracking-caps); text-transform: uppercase;
}
.chart__note {
  margin-top: var(--sp-3); padding-top: var(--sp-3);
  border-top: 1px solid var(--divider);
  font-size: var(--fs-sm); color: var(--text-3); line-height: var(--lh-snug);
}
.chart--bare { border: 0; box-shadow: none; padding: 0; background: none; }

/* Elements inside the SVG (attach these classes when hand-drawing the SVG on the HTML side) */
.grid-line { stroke: var(--gray-200); stroke-width: 1; shape-rendering: crispEdges; }
.axis-line { stroke: var(--gray-400); stroke-width: 1; shape-rendering: crispEdges; }
.zero-line { stroke: var(--gray-500); stroke-width: 1; shape-rendering: crispEdges; }
.tick-label { fill: var(--text-3); font-size: var(--fs-xs); font-family: var(--font-sans); }
.tick-label--y { text-anchor: end; }
.tick-label--x { text-anchor: middle; }
.series-line { fill: none; stroke: var(--series-treat); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.series-line--holdout {
  stroke: var(--series-hold); stroke-dasharray: var(--series-hold-dash); stroke-width: 2;
}
.series-area { fill: var(--series-treat-fill); stroke: none; }
.series-area--holdout { fill: var(--series-hold-fill); }
.series-dot { fill: var(--series-treat); stroke: var(--surface-1); stroke-width: 2; r: 4; }
.bar { fill: var(--cat-1); rx: 3; }
.bar--holdout { fill: var(--series-hold); }
.bar-stack > * { stroke: var(--surface-1); stroke-width: 2; }
.annot-line { stroke: var(--gray-800); stroke-width: 1; stroke-dasharray: 3 3; }
.annot-label { fill: var(--text-2); font-size: var(--fs-xs); font-family: var(--font-sans); }
.s-1 { fill: var(--cat-1); stroke: var(--cat-1); }
.s-2 { fill: var(--cat-2); stroke: var(--cat-2); }
.s-3 { fill: var(--cat-3); stroke: var(--cat-3); }
.s-4 { fill: var(--cat-4); stroke: var(--cat-4); }
.s-5 { fill: var(--cat-5); stroke: var(--cat-5); }
.s-6 { fill: var(--cat-6); stroke: var(--cat-6); }

/* Chart tooltip overlay */
.chart__tooltip {
  position: absolute; z-index: var(--z-tooltip);
  min-width: 148px; max-width: 260px;
  padding: var(--sp-2) var(--sp-3);
  background: var(--surface-1);
  border: 1px solid var(--border-2); border-radius: var(--r-2);
  box-shadow: var(--sh-3);
  font-size: var(--fs-sm);
  pointer-events: none;
  opacity: 0; transform: translateY(2px);
  transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.chart__tooltip.is-visible { opacity: 1; transform: translateY(0); }
.tooltip__title {
  font-weight: var(--fw-semibold); color: var(--text-1);
  padding-bottom: 5px; margin-bottom: 5px; border-bottom: 1px solid var(--divider);
}
.tooltip__row { display: flex; align-items: center; gap: var(--sp-2); }
.tooltip__row + .tooltip__row { margin-top: 3px; }
.tooltip__swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tooltip__key { color: var(--text-2); }
.tooltip__val { margin-left: auto; font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; }
.tooltip__foot { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--divider); color: var(--text-3); font-size: var(--fs-xs); }
.crosshair { stroke: var(--gray-500); stroke-width: 1; stroke-dasharray: 2 3; }

/* ---- 5.16 A/B control-group side-by-side comparison --------------------- */
.ab {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: stretch;
  border: 1px solid var(--border-1); border-radius: var(--r-3);
  background: var(--surface-1); overflow: hidden;
}
.ab__panel { padding: var(--sp-4) var(--sp-5); }
.ab__panel--treat { background: var(--brand-50); }
.ab__panel--control { background: var(--surface-2); }
.ab__label {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-2);
}
.ab__label::before {
  content: ""; width: 16px; height: 0; flex: none;
  border-top: 3px solid var(--series-treat); border-radius: 2px;
}
.ab__panel--control .ab__label::before {
  border-top: 2px dashed var(--series-hold);
}
.ab__value {
  margin-top: var(--sp-2);
  font-size: var(--fs-2xl); font-weight: var(--fw-semibold);
  letter-spacing: -0.02em; line-height: 1.15;
}
.ab__panel--control .ab__value { color: var(--text-2); }
.ab__meta { margin-top: 4px; font-size: var(--fs-sm); color: var(--text-3); line-height: var(--lh-snug); }
.ab__vs {
  display: grid; place-items: center;
  padding: 0 var(--sp-3);
  background: var(--surface-1);
  border-left: 1px solid var(--border-1); border-right: 1px solid var(--border-1);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--text-3);
  letter-spacing: var(--tracking-caps);
}
.ab__foot {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-5);
  border-top: 1px solid var(--border-1);
  background: var(--surface-1);
  font-size: var(--fs-sm); color: var(--text-2);
}
.ab__lift {
  font-size: var(--fs-lg); font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums; color: var(--pos-text);
}
.ab__lift--neg { color: var(--dan-text); }
.ab__sig { margin-left: auto; }

/* ---- 5.17 Empty state / Skeleton / Tooltip / Modal ---------------------- */
.empty {
  display: grid; justify-items: center; text-align: center;
  padding: var(--sp-8) var(--sp-5);
  border: 1px dashed var(--border-2); border-radius: var(--r-3);
  background: var(--surface-1);
}
.empty__icon {
  width: 34px; height: 34px; margin-bottom: var(--sp-3);
  border-radius: var(--r-2);
  /* text-3 on surface-3 is only 4.12:1 — the deepest recess is the one place the muted
     tier runs out of room, so this glyph steps up to text-2 (5.43:1). */
  background: var(--surface-3); color: var(--text-2);
  display: grid; place-items: center; font-size: var(--fs-lg);
}
.empty__title { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
.empty__text { margin-top: 5px; max-width: 44ch; font-size: var(--fs-sm); color: var(--text-2); }
.empty__actions { margin-top: var(--sp-4); display: flex; gap: var(--sp-2); }

.skel { background: var(--gray-200); border-radius: var(--r-1); position: relative; overflow: hidden; }
.skel::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
  transform: translateX(-100%);
  animation: shimmer 1.4s var(--ease) infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }
.skel--text { height: 12px; margin-bottom: 6px; }
.skel--text:last-child { width: 62%; margin-bottom: 0; }
.skel--title { height: 16px; width: 40%; margin-bottom: var(--sp-3); }
.skel--num { height: 28px; width: 128px; margin: var(--sp-2) 0; }
.skel--block { height: 180px; border-radius: var(--r-2); }
.skel--chip { height: 20px; width: 76px; border-radius: var(--r-full); }
.skel-row { display: flex; gap: var(--sp-3); align-items: center; }

/* Generic tooltip: add the data-tip attribute to any element */
.has-tip { position: relative; }
.has-tip::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%) translateY(2px);
  z-index: var(--z-tooltip);
  width: max-content; max-width: 240px;
  padding: 5px var(--sp-2);
  /* Not inverted any more: on a dark UI a near-white tooltip reads as a flashbulb. Sitting
     it at --gray-400 puts it ΔE 15 above a card, so it separates on lightness alone. */
  background: var(--gray-400); color: var(--gray-900);
  border-radius: var(--r-2);
  font-size: var(--fs-sm); font-weight: var(--fw-regular);
  line-height: var(--lh-snug); text-align: left; white-space: normal;
  box-shadow: var(--sh-2);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.has-tip:hover::after, .has-tip:focus-visible::after { opacity: 1; transform: translateX(-50%) translateY(0); }
.info-dot {
  display: inline-grid; place-items: center;
  width: 14px; height: 14px; flex: none;
  border: 1px solid var(--border-2); border-radius: 50%;
  color: var(--text-3); font-size: 9px; font-weight: var(--fw-bold);
  cursor: help;
}
.info-dot:hover { border-color: var(--brand-600); color: var(--brand-700); }

.overlay {
  position: fixed; inset: 0; z-index: var(--z-overlay);
  background: rgba(0, 0, 0, 0.62);   /* needs more weight than on light — the floor is already dark */
  display: grid; place-items: center;
  padding: var(--sp-5);
  overflow-y: auto;
}
.modal {
  position: relative; z-index: var(--z-modal);
  width: 100%; max-width: 520px;
  max-height: calc(100vh - var(--sp-8));
  display: flex; flex-direction: column;
  background: var(--surface-1);
  border: 1px solid var(--border-1); border-radius: var(--r-3);
  box-shadow: var(--sh-3);
  animation: modal-in var(--dur-base) var(--ease);
}
@keyframes modal-in { from { opacity: 0; transform: translateY(6px); } }
.modal--wide { max-width: 800px; }
.modal--narrow { max-width: 400px; }
.modal__head {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--divider);
}
.modal__title { font-size: var(--fs-lg); font-weight: var(--fw-semibold); line-height: var(--lh-snug); }
.modal__sub { margin-top: 2px; font-size: var(--fs-sm); color: var(--text-2); }
.modal__close {
  margin-left: auto; flex: none;
  width: 26px; height: 26px; border-radius: var(--r-2);
  display: grid; place-items: center;
  color: var(--text-3); font-size: var(--fs-lg); line-height: 1;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.modal__close:hover { background: var(--surface-3); color: var(--text-1); }
.modal__body { padding: var(--sp-5); overflow-y: auto; }
.modal__foot {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-5);
  border-top: 1px solid var(--divider);
  background: var(--surface-2);
  border-radius: 0 0 var(--r-3) var(--r-3);
  flex-wrap: wrap;
}
.modal__foot .u-spacer { flex: 1; }

/* ---- 5.18 Callout / explanatory box ------------------------------------- */
.callout {
  display: flex; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--inf-border); border-left-width: 3px;
  border-radius: var(--r-2);
  background: var(--inf-bg);
  color: var(--inf-text);
}
.callout--warn { border-color: var(--wrn-border); background: var(--wrn-bg); color: var(--wrn-text); }
.callout--quiet { background: var(--surface-2); border-color: var(--border-1); color: var(--text-2); }
.callout__icon {
  flex: none; width: 18px; height: 18px; margin-top: 1px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: currentColor; color: var(--surface-1);
  font-size: 11px; font-weight: var(--fw-bold);
}
.callout__icon::before { content: "i"; }
.callout--warn .callout__icon::before { content: "!"; }
.callout__content { min-width: 0; }
.callout__title { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
.callout__text {
  margin-top: 2px;
  font-size: var(--fs-sm); color: inherit; opacity: 0.92;
  line-height: var(--lh-normal);
}
.callout__text a, .callout__link {
  color: inherit; font-weight: var(--fw-semibold);
  border-bottom: 1px solid currentColor;
}

/* ---- 5.19 Footer methodology notes -------------------------------------- */
.method {
  margin-top: var(--sp-8);
  padding: var(--sp-6) var(--sp-6) var(--sp-7);
  border-top: 1px solid var(--border-1);
  background: var(--surface-1);

}
.method__title {
  font-size: var(--fs-sm); font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-3);
  margin-bottom: var(--sp-4);
}
.method__grid {
  display: grid; gap: var(--sp-5) var(--sp-6);
  grid-template-columns: repeat(auto-fit, minmax(238px, 1fr));
}
.method__h { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-1); margin-bottom: 5px; }
.method__p { font-size: var(--fs-sm); color: var(--text-2); line-height: var(--lh-normal); }
.method__list { margin-top: 6px; display: grid; gap: 4px; }
.method__list li {
  position: relative; padding-left: var(--sp-3);
  font-size: var(--fs-sm); color: var(--text-2); line-height: var(--lh-snug);
}
.method__list li::before {
  content: ""; position: absolute; left: 0; top: 8px;
  width: 4px; height: 1px; background: var(--gray-500);
}
.method__dl { display: grid; grid-template-columns: auto 1fr; gap: 3px var(--sp-3); font-size: var(--fs-sm); }
.method__dl dt { color: var(--text-3); white-space: nowrap; }
.method__dl dd { color: var(--text-1); font-variant-numeric: tabular-nums; }
.method__foot {
  margin-top: var(--sp-6); padding-top: var(--sp-4);
  border-top: 1px solid var(--divider);
  display: flex; gap: var(--sp-4); flex-wrap: wrap;
  font-size: var(--fs-xs); color: var(--text-3);
}

/* ==========================================================================
   8. PRINT — for the boss to print or save as a PDF monthly report
   ========================================================================== */
@media print {
  /* The screen theme is dark, but paper is not: re-declare the semantic layer in its light
     form so the whole component tree flips back without touching a single component rule.
     Both ramps revert to running light → dark, which is the orientation their role names
     assume, so the raw --gray- and --brand- call sites come along for free. */
  :root {
    --gray-100: #f8f9fa;  --gray-200: #eff1f4;  --gray-300: #e1e5ea;
    --gray-400: #c9cfd7;  --gray-500: #98a1ac;  --gray-600: #6e7889;
    --gray-700: #535d6d;  --gray-800: #39424f;  --gray-900: #1c232e;

    --brand-50:  #f1f7fa;  --brand-100: #dfebf3;  --brand-200: #bdd8e8;
    --brand-300: #8fbbd4;  --brand-400: #4e97bc;  --brand-500: #1f7fa9;
    --brand-600: #12719e;  --brand-700: #0e5c82;
    --brand-800: #0b4a69;  --brand-900: #083a54;

    --pos-bg: #e9f4ec;  --pos-border: #b7dcc4;  --pos-text: #12653a;  --pos-solid: #1e7a46;
    --wrn-bg: #fcf3e2;  --wrn-border: #e9d3a4;  --wrn-text: #87560a;  --wrn-solid: #a9720b;
    --dan-bg: #fcedeb;  --dan-border: #efc8c3;  --dan-text: #9c2b26;  --dan-solid: #b4342f;
    --inf-bg: #e9f2f8;  --inf-border: #bdd8e8;  --inf-text: #14587a;  --inf-solid: #12719e;
    --neu-bg: #eff1f4;  --neu-border: #dce1e6;  --neu-text: #48515f;  --neu-solid: #6e7889;
    --acc-bg: #f1f7fa;  --acc-border: #bdd8e8;  --acc-text: #0e5c82;  --acc-solid: #0e5c82;

    --surface-page: #fff;   --surface-1: #fff;
    --surface-2: var(--gray-100);  --surface-3: var(--gray-200);
    --surface-hover: #fff;  --surface-mono: #f8f9fa;
    --text-inverse: #fff;   --divider: var(--gray-200);
    --sh-1: none; --sh-2: none; --sh-3: none;
  }
  body { background: #fff; font-size: 10.5pt; }
  /* Zebra striping is set outside the token layer, so it needs its own revert. */
  .table tbody tr:nth-child(even),
  .table tbody tr:nth-child(even) .table__cell--sticky { background: #fbfcfd; }
  .sidebar, .topbar, .tabs, .section__actions, .chart__tools,
  .btn, .approval__foot, .overlay, .modal__close, .table__toggle { display: none !important; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .main { padding: 0; }
  .card, .kpi, .chart, .memo, .approval, .table-wrap, .authz, .ab {
    box-shadow: none; border: 1px solid #b9bec6; break-inside: avoid;
  }
  .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi--hero { background: none; }
  .section, .chart, .approval, .method { break-inside: avoid; }
  .section__head { break-after: avoid; }
  .table-wrap { overflow: visible; max-height: none; }
  .table { min-width: 0; }
  .table thead th { position: static; background: #f1f3f5; }
  .table__detail-row { display: table-row !important; }
  .method { margin-top: 16pt; }
  a[href]::after { content: ""; }
  .chart__tooltip, .has-tip::after { display: none !important; }
}

    { heading: 'I. How the increment is computed',
      body: 'We compute the increment with a randomly assigned holdout — not period-over-period comparison, and not an attribution model. Assignment happens at the <b>customer level</b>: SHA-256(customer_id + salt) mod 1000 decides it, with buckets 910–999 as the holdout, which came to 1,207 people in July (1,207 / 13,400 = 9.0%). The salt is fixed, so assignment does not change within 6 months, which keeps the same customer from contaminating results across devices or across periods. The holdout <b>still receives service replies as normal</b> but receives no outbound contact at all, so what we measure is the net increment from outbound. Increment = actual revenue of the exposed group − (revenue per person in the holdout × number of people in the exposed group). Before the experiment starts we run a pre-period balance check (2026-04 to 06 revenue per person differed by −1.6%, p = 0.674, treated as balanced); if it is not balanced, the results may not be counted. For variance we Winsorize @ NT$8,000 to strip outliers, then apply CUPED (covariate: revenue per person over the prior 6 months, ρ = 0.527) to cut noise, and we disclose the 95% confidence interval and the p value. Revenue is recognized at amounts actually collected, net of discounts, shipping subsidies, and returns; for subscriptions only the first cycle is recognized, with no advance recognition of later cycles. Every input to the calculation (numerator, denominator, holdout size, baseline) is fully disclosed, so you can recompute it yourself.' },
    { heading: 'II. How the success fee is computed',
      body: 'Success fee = billable incremental revenue × 12%, and it has to pass three gates in order. <b>① Significance threshold:</b> if p ≥ 0.05 (the increment cannot be distinguished from 0), the success fee for that month is 0 and we charge only the subscription fee. <b>② Conservative haircut:</b> the billing base is not the point estimate but "point estimate − 1 standard error" (roughly 84% one-sided confidence) — for July that is 583,175 − 170,243 = 412,932, and the 170,243 we give up we do not charge. The greater the uncertainty, the more we give up. <b>③ Hard cap:</b> subscription fee + success fee never exceeds the monthly hard cap you set (currently NT$60,000), and anything above it is automatically waived. At 100% we stop outbound tasks; service interactions and in-conversation upsells are not interrupted. The cap is a threshold for that month only, and it resets automatically on the 1st of the next month. Tasks in progress are not billed in advance; rolled-back tasks are not billed. Model inference, tool retrieval, and messaging channel costs on the platform side are absorbed by us and are not counted against your cap, but they are fully disclosed in the observability records.' },
